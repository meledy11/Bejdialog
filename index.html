      { img:"sick_02", zh:"别担心，我来照顾你。", py:"Bié dānxīn, wǒ lái zhàogù nǐ.", ru:"Не волнуйся, я позабочусь о тебе.", who:"w", speaker:"👱‍♀️ Блондинка" },
      { img:"sick_03", zh:"谢谢你来看我。", py:"Xièxie nǐ lái kàn wǒ.", ru:"Спасибо, что пришла навестить.", who:"s", speaker:"👧 Девушка (омбре)" },
      { img:"sick_04", zh:"我给你买了药和热茶。", py:"Wǒ gěi nǐ mǎi le yào hé rè chá.", ru:"Я купила тебе лекарства и горячий чай.", who:"w", speaker:"👱‍♀️ Блондинка" },
      { img:"sick_05", zh:"你真好，我感觉好多了。", py:"Nǐ zhēn hǎo, wǒ gǎnjué hǎo duō le.", ru:"Ты такая хорошая, мне уже лучше.", who:"s", speaker:"👧 Девушка (омбре)" },
      { img:"sick_06", zh:"好好休息，明天会好的！", py:"Hǎohǎo xiūxi, míngtiān huì hǎo de!", ru:"Отдыхай хорошенько, завтра будет лучше!", who:"w", speaker:"👱‍♀️ Блондинка" }
    ]
  }
};

const SCENE_ORDER = ['mcdonalds', 'help', 'late', 'phone', 'job', 'wallet', 'birthday', 'battery', 'directions', 'sick'];
const THEME_MAP = { mcdonalds: '', help: 'help-theme', late: 'late-theme', phone: 'phone-theme', job: 'job-theme', wallet: 'wallet-theme', birthday: 'birthday-theme', battery: 'battery-theme', directions: 'directions-theme', sick: 'sick-theme' };
const SCENE_NAMES = { mcdonalds: '🍔 McDonald\'s', help: '🤝 Просьба о помощи', late: '⏰ Опоздание', phone: '📱 Что делать?', job: '💼 Новая работа', wallet: '👛 Потерянный кошелёк', birthday: '🎂 День рождения', battery: '🔋 Разрядился телефон', directions: '🗺️ Как пройти?', sick: '🤒 Я простудилась' };

const REPEAT_PAUSE = 2500;

let currentScene = 'mcdonalds';
let zhVoice = null, ruVoice = null, currentSpeed = 0.55, db = null;
let isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let activeRecorder = null, activeStream = null, activeRecordingKey = null, recordingTimeout = null;
let audioUnlocked = false, globalAudio = null, isPlaying = false;
let audioContext = null;

function unlockAudioOnInteraction() {
  if (audioUnlocked) return;
  const audio = new Audio();
  audio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
  audio.play().then(() => {
    audio.pause(); audioUnlocked = true;
    if ('speechSynthesis' in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(''); u.volume = 0; speechSynthesis.speak(u); }
  }).catch(() => { audioUnlocked = true; });
}
document.addEventListener('touchstart', unlockAudioOnInteraction, { once: true });
document.addEventListener('click', unlockAudioOnInteraction, { once: true });

function wakeUpSpeechSynthesis() {
  if (!('speechSynthesis' in window)) return Promise.resolve();
  return new Promise(resolve => { speechSynthesis.cancel(); if (isIOS) speechSynthesis.resume(); setTimeout(resolve, 50); });
}

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('ChineseLearningAudio_v6', 1);
    request.onupgradeneeded = (event) => { const db = event.target.result; if (!db.objectStoreNames.contains('recordings')) db.createObjectStore('recordings'); };
    request.onsuccess = (event) => { db = event.target.result; resolve(db); };
    request.onerror = (event) => reject(event.target.error);
  });
}
function saveToDB(key, blob) { return new Promise((resolve, reject) => { const tx = db.transaction(['recordings'], 'readwrite'); const req = tx.objectStore('recordings').put(blob, key); req.onsuccess = () => resolve(); req.onerror = () => reject(req.error); }); }
function getFromDB(key) { return new Promise((resolve, reject) => { const tx = db.transaction(['recordings'], 'readonly'); const req = tx.objectStore('recordings').get(key); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); }
function deleteFromDB(key) { return new Promise((resolve, reject) => { const tx = db.transaction(['recordings'], 'readwrite'); const req = tx.objectStore('recordings').delete(key); req.onsuccess = () => resolve(); req.onerror = () => reject(req.error); }); }

function loadVoices() {
  const voices = speechSynthesis.getVoices();
  zhVoice = voices.find(v => v.lang.includes('zh-CN') || v.lang.includes('cmn')) || voices[0];
  ruVoice = voices.find(v => v.lang.includes('ru-RU')) || voices[0];
}
if ('speechSynthesis' in window) { speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }

document.getElementById('speedSlider').addEventListener('input', (e) => { currentSpeed = parseFloat(e.target.value); document.getElementById('speedValue').textContent = currentSpeed.toFixed(2) + 'x'; });

function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

function resetAllRecordButtons() {
  document.querySelectorAll('.record-btn').forEach(btn => btn.classList.remove('recording'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('recording-panel'));
}

async function renderScene(sceneKey) {
  const data = SCENES[sceneKey];
  const container = document.getElementById('panelsContainer');
  document.getElementById('sceneTitle').textContent = data.title;
  document.getElementById('sceneSubtitle').textContent = data.subtitle;
  document.getElementById('switchBtn').textContent = data.switchLabel;
  document.body.className = '';
  const theme = THEME_MAP[sceneKey];
  if (theme) document.body.classList.add(theme);

  let html = "";
  data.panels.forEach((p, i) => {
    const bubbleClass = p.who === "w" ? "waiter" : "sailor";
    const speakerClass = p.who === "w" ? "w" : "s";
    const imgSrc = `img/${p.img}.png`;
    const isLast = i === data.panels.length - 1;
    html += `
    <div class="panel" id="${sceneKey}-p${i}">
      <div class="panel-inner">
        <div class="panel-header">
          <div class="panel-num"><span class="panel-num-badge">${i+1}</span>${p.speaker}</div>
          <div class="speak-buttons">
            <button class="action-btn replay-btn" id="${sceneKey}-replay-${i}" onclick="playCard('${sceneKey}',${i})" title="Повторить">🔊</button>
            <button class="action-btn speak-btn speak-btn-zh" id="${sceneKey}-btn-zh-${i}" onclick="handleSpeak('${sceneKey}',${i},'zh')" title="Только китайский">🇨🇳</button>
            <button class="action-btn speak-btn speak-btn-ru" id="${sceneKey}-btn-ru-${i}" onclick="handleSpeak('${sceneKey}',${i},'ru')" title="Только русский">🇷🇺</button>
            <button class="action-btn record-btn" id="${sceneKey}-rec-ru-${i}" onclick="toggleRecording('${sceneKey}',${i},'ru')" title="Записать русский">🎤<span class="delete-overlay" onclick="event.stopPropagation(); handleDelete('${sceneKey}',${i},'ru')">✕</span></button>
          </div>
        </div>
        <div class="panel-img-wrap" id="${sceneKey}-wrap${i}">
          <img class="panel-img" src="${imgSrc}" alt="Panel ${i+1}" onerror="this.parentElement.classList.add('has-error')" />
          <div class="img-error-msg"><div class="big">🖼️</div><div><b>${p.img}.png</b> не найден</div></div>
        </div>
        <div class="dialogue">
          <div class="bubble ${bubbleClass}" id="${sceneKey}-bub${i}">
            <div class="speaker-tag ${speakerClass}">${p.speaker}</div>
            <div class="zh-text" id="${sceneKey}-zh-${i}">${p.zh}</div>
            <div class="py-text">${p.py}</div>
            <div class="ru-text" id="${sceneKey}-ru-${i}">${p.ru}</div>
          </div>
          <div class="now-playing-bar" id="${sceneKey}-np${i}">
            <div class="bars"><span></span><span></span><span></span><span></span></div>
            <span id="${sceneKey}-np-text${i}">Идёт озвучка...</span>
          </div>
          <button class="next-card-btn" id="${sceneKey}-next-${i}" onclick="playAndNext('${sceneKey}',${i})">${isLast ? '↻ в начало' : '→ далее'}</button>
        </div>
      </div>
    </div>`;
  });
  container.innerHTML = html;
  container.scrollTop = 0;
  await checkRecordings(sceneKey);
}

async function checkRecordings(sceneKey) {
  const data = SCENES[sceneKey];
  for (let i = 0; i < data.panels.length; i++) {
    try {
      const blob = await getFromDB(`${sceneKey}_ru_${i}`);
      if (blob) { const recBtn = document.getElementById(`${sceneKey}-rec-ru-${i}`); if (recBtn) recBtn.classList.add('has-recording'); }
    } catch(e) {}
  }
}

function switchScene() {
  stopPlayback();
  const currentIndex = SCENE_ORDER.indexOf(currentScene);
  const nextIndex = (currentIndex + 1) % SCENE_ORDER.length;
  currentScene = SCENE_ORDER[nextIndex];
  renderScene(currentScene);
  showToast(SCENE_NAMES[currentScene]);
}

function stopPlayback() {
  isPlaying = false;
  speechSynthesis.cancel();
  if (globalAudio) { globalAudio.pause(); globalAudio.currentTime = 0; }
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active-panel'));
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  document.querySelectorAll('.replay-btn').forEach(b => b.classList.remove('playing'));
  document.querySelectorAll('.next-card-btn').forEach(b => b.classList.remove('playing'));
  document.querySelectorAll('.now-playing-bar').forEach(n => n.classList.remove('visible'));
  document.querySelectorAll('.zh-text, .ru-text').forEach(el => el.classList.remove('active'));
  document.getElementById('stopBtn').classList.remove('visible');
}

async function toggleRecording(sceneKey, idx, lang) {
  const recBtn = document.getElementById(`${sceneKey}-rec-${lang}-${idx}`);
  const panelEl = document.getElementById(`${sceneKey}-p${idx}`);
  if (activeRecordingKey && activeRecordingKey.key === sceneKey && activeRecordingKey.idx === idx) { stopCurrentRecording(); return; }
  if (activeRecordingKey) { stopCurrentRecording(); await sleep(300); }
  try {
    resetAllRecordButtons();
    const stream = await navigator.mediaDevices.getUserMedia({ 
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, sampleRate: 48000, channelCount: 1 } 
    });
    activeStream = stream;
    let mimeType = 'audio/webm;codecs=opus';
    if (isIOS) { if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4'; else if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm'; }
    const recorder = new MediaRecorder(stream, { mimeType, audioBitsPerSecond: 128000 });
    activeRecorder = recorder;
    activeRecordingKey = { key: sceneKey, idx, lang };
    const chunks = [];
    recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = async () => {
      const blob = new Blob(chunks, { type: mimeType });
      try { await saveToDB(`${sceneKey}_${lang}_${idx}`, blob); document.getElementById(`${sceneKey}-rec-${lang}-${idx}`).classList.add('has-recording'); showToast('✅ Сохранено!'); } catch(e) { showToast('❌ Ошибка'); }
      if (activeStream) { activeStream.getTracks().forEach(t => t.stop()); activeStream = null; }
      activeRecorder = null; activeRecordingKey = null; resetAllRecordButtons();
    };
    recorder.onerror = () => { showToast('❌ Ошибка записи'); cleanupRecording(); };
    recBtn.classList.add('recording');
    if (panelEl) panelEl.classList.add('recording-panel');
    recorder.start();
    showToast('🔴 Запись...');
    recordingTimeout = setTimeout(() => { if (activeRecordingKey?.idx === idx) stopCurrentRecording(); }, 15000);
  } catch (err) { console.error(err); showToast('⚠️ Нет доступа к микрофону'); cleanupRecording(); }
}
function stopCurrentRecording() { if (recordingTimeout) clearTimeout(recordingTimeout); if (activeRecorder && activeRecorder.state !== 'inactive') { try { activeRecorder.stop(); } catch(e) { cleanupRecording(); } } else { cleanupRecording(); } }
function cleanupRecording() { if (recordingTimeout) clearTimeout(recordingTimeout); if (activeStream) { activeStream.getTracks().forEach(t => t.stop()); activeStream = null; } activeRecorder = null; activeRecordingKey = null; resetAllRecordButtons(); }
async function handleDelete(sceneKey, idx, lang) { try { await deleteFromDB(`${sceneKey}_${lang}_${idx}`); document.getElementById(`${sceneKey}-rec-${lang}-${idx}`).classList.remove('has-recording'); showToast('🗑️ Удалено'); } catch(e) {} }

function playTTSRobust(sceneKey, idx, lang) {
  return new Promise(async (resolve) => {
    if (!isPlaying) { resolve(); return; }
    highlightText(sceneKey, idx, lang);
    const p = SCENES[sceneKey].panels[idx];
    const text = lang === 'zh' ? p.zh : p.ru;
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang === 'zh' ? "zh-CN" : "ru-RU";
    utterance.rate = lang === 'zh' ? currentSpeed : currentSpeed * 1.1;
    utterance.pitch = (lang === 'zh' && p.who === "s") ? 1.15 : 0.9;
    if (lang === 'zh' && zhVoice) utterance.voice = zhVoice;
    if (lang === 'ru' && ruVoice) utterance.voice = ruVoice;
    let finished = false;
    const finish = () => { if(finished) return; finished=true; clearHighlight(sceneKey, idx, lang); resolve(); };
    const maxDuration = Math.min((text.length * 400) / (lang === 'zh' ? currentSpeed : currentSpeed * 1.1) + 3000, 20000);
    const safetyTimeout = setTimeout(finish, maxDuration);
    utterance.onend = () => { clearTimeout(safetyTimeout); finish(); };
    utterance.onerror = () => { clearTimeout(safetyTimeout); finish(); };
    await wakeUpSpeechSynthesis();
    setTimeout(() => { if (!finished && isPlaying) { try { speechSynthesis.speak(utterance); } catch(e) { finish(); } } else if (!isPlaying) { finish(); } }, 100);
  });
}

function normalizeAudioBuffer(audioBuffer, targetPeak = 0.9) {
  const channelData = audioBuffer.getChannelData(0);
  let maxPeak = 0;
  for (let i = 0; i < channelData.length; i++) { const abs = Math.abs(channelData[i]); if (abs > maxPeak) maxPeak = abs; }
  if (maxPeak < 0.001) return audioBuffer;
  const gain = targetPeak / maxPeak;
  if (gain <= 1.0) return audioBuffer;
  for (let i = 0; i < channelData.length; i++) { channelData[i] = channelData[i] * gain; }
  return audioBuffer;
}

function playRecordingWithNormalization(blob, sceneKey, idx, lang) {
  return new Promise((resolve) => {
    if (!isPlaying) { resolve(); return; }
    if (!audioContext) {
      try { audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e) { playRecordingFallback(blob, sceneKey, idx, lang, resolve); return; }
    }
    if (audioContext.state === 'suspended') audioContext.resume();
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const arrayBuffer = e.target.result;
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        normalizeAudioBuffer(audioBuffer, 0.9);
        highlightText(sceneKey, idx, lang);
        let finished = false;
        const finish = () => { if(finished) return; finished=true; clearHighlight(sceneKey, idx, lang); resolve(); };
        const source = audioContext.createBufferSource();
        source.buffer = audioBuffer;
        const gainNode = audioContext.createGain();
        gainNode.gain.value = 1.0;
        source.connect(gainNode);
        gainNode.connect(audioContext.destination);
        const safetyTimeout = setTimeout(finish, 15000);
        source.onended = () => { clearTimeout(safetyTimeout); finish(); };
        source.start(0);
      } catch(err) { console.error('AudioContext error:', err); playRecordingFallback(blob, sceneKey, idx, lang, resolve); }
    };
    reader.onerror = () => { playRecordingFallback(blob, sceneKey, idx, lang, resolve); };
    reader.readAsArrayBuffer(blob);
  });
}

function playRecordingFallback(blob, sceneKey, idx, lang, resolve) {
  if (!globalAudio) globalAudio = document.getElementById('globalAudio');
  const audioUrl = URL.createObjectURL(blob);
  globalAudio.src = audioUrl; globalAudio.playsInline = true; globalAudio.webkitPlaysInline = true; globalAudio.volume = 1.0;
  highlightText(sceneKey, idx, lang);
  let finished = false;
  const finish = () => { if(finished) return; finished=true; clearHighlight(sceneKey, idx, lang); URL.revokeObjectURL(audioUrl); resolve(); };
  const safetyTimeout = setTimeout(finish, 15000);
  globalAudio.onended = () => { clearTimeout(safetyTimeout); finish(); };
  globalAudio.onerror = () => { clearTimeout(safetyTimeout); finish(); };
  globalAudio.play().catch(() => { clearTimeout(safetyTimeout); finish(); });
}

function playRecordingRobust(blob, sceneKey, idx, lang) { return playRecordingWithNormalization(blob, sceneKey, idx, lang); }

function highlightText(sceneKey, idx, lang) {
  const el = document.getElementById(`${sceneKey}-${lang}-${idx}`);
  const panel = document.getElementById(`${sceneKey}-p${idx}`);
  const btn = document.getElementById(`${sceneKey}-btn-${lang}-${idx}`);
  const np = document.getElementById(`${sceneKey}-np${idx}`);
  const npT = document.getElementById(`${sceneKey}-np-text${idx}`);
  const replayBtn = document.getElementById(`${sceneKey}-replay-${idx}`);
  const nextBtn = document.getElementById(`${sceneKey}-next-${idx}`);
  if(el) el.classList.add('active');
  if(panel) panel.classList.add('active-panel');
  if(btn) btn.classList.add('speaking');
  if(replayBtn) replayBtn.classList.add('playing');
  if(nextBtn) nextBtn.classList.add('playing');
  if(np) np.classList.add('visible');
  if(npT) npT.textContent = lang === 'zh' ? '🇨🇳 Китайский...' : '🇷 Русский...';
}
function clearHighlight(sceneKey, idx, lang) {
  const el = document.getElementById(`${sceneKey}-${lang}-${idx}`);
  const panel = document.getElementById(`${sceneKey}-p${idx}`);
  const btn = document.getElementById(`${sceneKey}-btn-${lang}-${idx}`);
  const np = document.getElementById(`${sceneKey}-np${idx}`);
  const replayBtn = document.getElementById(`${sceneKey}-replay-${idx}`);
  const nextBtn = document.getElementById(`${sceneKey}-next-${idx}`);
  if(el) el.classList.remove('active');
  if(panel) panel.classList.remove('active-panel');
  if(btn) btn.classList.remove('speaking');
  if(replayBtn) replayBtn.classList.remove('playing');
  if(nextBtn) nextBtn.classList.remove('playing');
  if(np) np.classList.remove('visible');
}

function showRepeatPause(sceneKey, idx) {
  const np = document.getElementById(`${sceneKey}-np${idx}`);
  const npT = document.getElementById(`${sceneKey}-np-text${idx}`);
  if (np) np.classList.add('visible');
  if (npT) npT.textContent = '🗣️ Повторите фразу вслух...';
}

async function handleSpeak(sceneKey, idx, lang) {
  isPlaying = true;
  document.getElementById('stopBtn').classList.add('visible');
  await wakeUpSpeechSynthesis();
  if (lang === 'zh') await playTTSRobust(sceneKey, idx, 'zh');
  else { try { const blob = await getFromDB(`${sceneKey}_ru_${idx}`); if (blob) await playRecordingRobust(blob, sceneKey, idx, 'ru'); else await playTTSRobust(sceneKey, idx, 'ru'); } catch(e) { await playTTSRobust(sceneKey, idx, 'ru'); } }
  isPlaying = false;
  document.getElementById('stopBtn').classList.remove('visible');
}

async function playCardInternal(sceneKey, idx) {
  const btn = document.getElementById(`${sceneKey}-replay-${idx}`);
  if (btn) btn.classList.add('playing');
  await wakeUpSpeechSynthesis();
  await playTTSRobust(sceneKey, idx, 'zh');
  if (!isPlaying) return;
  await sleep(500);
  if (!isPlaying) return;
  await wakeUpSpeechSynthesis();
  try {
    const blob = await getFromDB(`${sceneKey}_ru_${idx}`);
    if (blob) { await playRecordingRobust(blob, sceneKey, idx, 'ru'); if (!isPlaying) return; await wakeUpSpeechSynthesis(); }
    else { await playTTSRobust(sceneKey, idx, 'ru'); }
  } catch(e) { await playTTSRobust(sceneKey, idx, 'ru'); }
  if (!isPlaying) return;
  showRepeatPause(sceneKey, idx);
  await sleep(REPEAT_PAUSE);
  if (btn) btn.classList.remove('playing');
}

async function playCard(sceneKey, idx) {
  isPlaying = true;
  document.getElementById('stopBtn').classList.add('visible');
  await playCardInternal(sceneKey, idx);
  isPlaying = false;
  document.getElementById('stopBtn').classList.remove('visible');
}

async function playAndNext(sceneKey, idx) {
  isPlaying = true;
  document.getElementById('stopBtn').classList.add('visible');
  const panels = SCENES[sceneKey].panels;
  await playCardInternal(sceneKey, idx);
  if (!isPlaying) return;
  let nextIdx = idx + 1;
  if (nextIdx >= panels.length) { nextIdx = 0; showToast('🔄 Начинаем сначала'); }
  const nextPanel = document.getElementById(`${sceneKey}-p${nextIdx}`);
  if (nextPanel) { setTimeout(() => { nextPanel.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 300); }
  isPlaying = false;
  document.getElementById('stopBtn').classList.remove('visible');
}

function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

window.addEventListener('load', async () => {
  globalAudio = document.getElementById('globalAudio');
  await initDB();
  renderScene(currentScene);
  if (!('speechSynthesis' in window)) showToast('⚠️ Используйте Chrome/Safari');
});

document.addEventListener('visibilitychange', () => { if (document.hidden) stopPlayback(); });
</script>
