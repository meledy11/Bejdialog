<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍔 McDonald's — Запись голоса + GitHub</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Comfortaa:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(180deg, #fff8f0 0%, #ffe8d6 50%, #ffd6b3 100%);
      font-family: 'Comfortaa', 'Noto Sans SC', sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .manga-container { max-width: 700px; margin: 0 auto; padding: 0 12px; }

    .scene-title {
      border-radius: 20px; padding: 22px 18px; text-align: center;
      margin: 15px 0 18px; 
      background: linear-gradient(135deg, #da291c, #ff4b2b, #ffc72c);
      box-shadow: 0 8px 32px rgba(218,41,28,0.25);
      color: white;
    }
    .scene-title h1 { font-size: 20px; margin-bottom: 5px; text-shadow: 2px 2px 8px rgba(0,0,0,0.2); }
    .scene-title p  { font-size: 13px; opacity: 0.95; margin-bottom: 14px; }

    .play-all-btn {
      background: white; color: #da291c; border: none;
      padding: 10px 24px; border-radius: 30px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .play-all-btn:hover  { transform: scale(1.05); }
    .play-all-btn.playing { background: #ffe8d6; color: #da291c; }

    /* Настройки GitHub */
    .github-settings {
      background: white;
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(218,41,28,0.1);
      border: 2px solid #ffd6b3;
    }
    .github-settings h3 {
      color: #da291c;
      font-size: 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .github-settings input {
      width: 100%;
      padding: 8px 12px;
      border: 2px solid #ffd6b3;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    .github-settings input:focus {
      border-color: #da291c;
    }
    .github-settings input::placeholder {
      color: #cc8888;
    }
    .save-settings-btn {
      background: linear-gradient(135deg, #da291c, #ff6b6b);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .save-settings-btn:hover { transform: scale(1.05); }
    .save-settings-btn.saved { background: linear-gradient(135deg, #4CAF50, #67b26f); }

    .speed-control {
      background: white;
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(218,41,28,0.1);
      border: 2px solid #ffd6b3;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .speed-label {
      font-weight: 700;
      color: #da291c;
      font-size: 13px;
    }
    .speed-slider {
      flex: 1;
      min-width: 150px;
      -webkit-appearance: none;
      appearance: none;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg, #da291c, #ffc72c);
      outline: none;
    }
    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: white;
      border: 3px solid #da291c;
      cursor: pointer;
    }
    .speed-value {
      font-weight: 700;
      color: #da291c;
      font-size: 14px;
      min-width: 50px;
      text-align: center;
      background: #fff0f0;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .panel {
      background: white; border-radius: 16px; margin-bottom: 16px;
      overflow: hidden; box-shadow: 0 4px 20px rgba(218,41,28,0.1);
      border: 2px solid #ffd6b3; transition: all 0.3s;
    }
    .panel.active-panel {
      border-color: #da291c;
      box-shadow: 0 0 0 3px rgba(218,41,28,0.15), 0 8px 30px rgba(255,199,44,0.25);
    }

    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: #fffaf8;
      border-bottom: 1px dashed #ffd6b3;
    }
    .panel-num {
      font-weight: 700; color: #da291c; font-size: 13px;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-num-badge {
      background: linear-gradient(135deg, #da291c, #ffc72c); color: white;
      width: 24px; height: 24px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px;
    }

    .speak-buttons { display: flex; gap: 6px; }

    .speak-btn {
      border: none; width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 15px; transition: 0.2s; flex-shrink: 0;
      color: white;
    }
    .speak-btn:hover  { transform: scale(1.15); }
    .speak-btn.speaking { animation: pulse 0.9s ease-in-out infinite; }
    .speak-btn-zh { background: linear-gradient(135deg, #da291c, #ff6b6b); }
    .speak-btn-ru { background: linear-gradient(135deg, #4a90e2, #67b26f); }
    
    .record-btn {
      border: none; width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 15px; transition: 0.2s; flex-shrink: 0;
      color: white;
      background: linear-gradient(135deg, #ff9800, #f57c00);
    }
    .record-btn:hover { transform: scale(1.15); }
    .record-btn.recording { 
      background: linear-gradient(135deg, #f44336, #d32f2f);
      animation: pulse 0.9s ease-in-out infinite;
    }
    .record-btn.has-recording {
      background: linear-gradient(135deg, #4CAF50, #67b26f);
    }
    
    @keyframes pulse {
      0%,100%{box-shadow:0 0 0 0 rgba(218,41,28,0.45)}
      50%{box-shadow:0 0 0 10px rgba(218,41,28,0)}
    }

    .panel-img-wrap {
      position: relative; background: linear-gradient(135deg, #fff8f0, #ffe8d6);
      min-height: 150px; overflow: hidden;
      border-top: 1px dashed #ffd6b3; border-bottom: 1px dashed #ffd6b3;
    }
    .panel-img { width: 100%; display: block; }
    .img-error-msg {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center; flex-direction: column;
      gap: 8px; color: #cc6644; text-align: center; padding: 20px; font-size: 13px;
    }
    .img-error-msg .big { font-size: 40px; }
    .panel-img-wrap.has-error .panel-img     { display: none; }
    .panel-img-wrap.has-error .img-error-msg { display: flex; }

    .dialogue { padding: 18px 16px; }

    .bubble {
      padding: 16px; border-radius: 14px; margin-bottom: 14px;
      border: 2px solid transparent;
    }
    .bubble.waiter { background: linear-gradient(135deg, #f0f8ff, #fff); border-color: #99ccff; }
    .bubble.sailor { background: linear-gradient(135deg, #fff5f8, #fff); border-color: #ffb3cc; }

    .speaker-tag {
      font-size: 12px; font-weight: 700; margin-bottom: 8px;
    }
    .speaker-tag.w { color: #4488cc; }
    .speaker-tag.s { color: #cc4488; }

    .zh-text {
      font-family: 'Noto Sans SC', sans-serif; 
      font-size: 26px; font-weight: 700; color: #2a2a2a; 
      margin-bottom: 8px; line-height: 1.6;
      letter-spacing: 2px;
      padding: 8px 12px;
      border-radius: 10px;
      transition: all 0.3s ease;
      background: white;
    }
    .zh-text.active {
      background: #ffc72c;
      color: #da291c;
      box-shadow: 0 4px 15px rgba(255, 199, 44, 0.6);
      transform: scale(1.02);
    }

    .py-text { 
      font-size: 15px; color: #888; font-style: italic; 
      margin-bottom: 10px; font-weight: 600;
    }

    .ru-text {
      font-size: 16px; color: #555; line-height: 1.6;
      padding: 8px 12px;
      border-left: 4px solid #ffd6b3;
      border-radius: 10px;
      transition: all 0.3s ease;
      background: white;
    }
    .ru-text.active {
      background: #4a90e2;
      color: white;
      border-left-color: #2c5aa0;
      box-shadow: 0 4px 15px rgba(74, 144, 226, 0.5);
      transform: scale(1.02);
    }

    .audio-player {
      margin-top: 10px;
      padding: 8px 12px;
      background: #f5f5f5;
      border-radius: 10px;
      display: none;
    }
    .audio-player.visible { display: block; }
    .audio-player audio {
      width: 100%;
      height: 36px;
    }

    .now-playing-bar {
      display: none; align-items: center; gap: 8px;
      font-size: 12px; color: #da291c; font-weight: 700;
      padding: 6px 14px; background: #fff0f0;
      border-radius: 20px; margin-top: 12px;
    }
    .now-playing-bar.visible { display: inline-flex; }
    .bars { display: flex; gap: 3px; align-items: flex-end; height: 14px; }
    .bars span {
      width: 4px; background: #da291c; border-radius: 2px;
      animation: barAnim 0.6s ease-in-out infinite;
    }
    .bars span:nth-child(1){height:5px;animation-delay:0s}
    .bars span:nth-child(2){height:10px;animation-delay:.1s}
    .bars span:nth-child(3){height:6px;animation-delay:.2s}
    .bars span:nth-child(4){height:12px;animation-delay:.05s}
    @keyframes barAnim { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(0.3)} }

    .upload-status {
      font-size: 11px;
      color: #4CAF50;
      margin-top: 6px;
      display: none;
    }
    .upload-status.visible { display: block; }

    .footer {
      text-align: center; padding: 28px 20px; color: #cc6644; font-size: 12px;
    }

    .toast {
      position: fixed; bottom: 22px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(40,15,50,0.92); color: white;
      padding: 11px 22px; border-radius: 28px;
      font-size: 13px; font-family: inherit; z-index: 999;
      transition: transform 0.3s ease; pointer-events: none; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="manga-container">
  <div class="scene-title">
    <h1>🍔 在麦当劳 — Запись голоса + GitHub</h1>
    <p>Запишите свой голос и сохраните на GitHub!</p>
    <button class="play-all-btn" id="playBtn-mcdonalds" onclick="playAll('mcdonalds')">▶ Озвучить весь диалог</button>
  </div>

  <!-- Настройки GitHub -->
  <div class="github-settings">
    <h3>⚙️ Настройки GitHub</h3>
    <input type="text" id="githubToken" placeholder="GitHub Personal Access Token" />
    <input type="text" id="githubUser" placeholder="Имя пользователя GitHub" />
    <input type="text" id="githubRepo" placeholder="Название репозитория" />
    <button class="save-settings-btn" id="saveSettingsBtn" onclick="saveGitHubSettings()">💾 Сохранить настройки</button>
  </div>

  <div class="speed-control">
    <div class="speed-label"> Скорость TTS:</div>
    <input type="range" id="speedSlider" class="speed-slider" min="0.3" max="1.0" step="0.05" value="0.55">
    <div class="speed-value" id="speedValue">0.55x</div>
  </div>

  <div id="panels-mcdonalds"></div>

  <div class="footer">
     McDonald's Chinese Learning · 2026<br>
    <small>Записывайте голос → Сохраняйте на GitHub → Используйте вместо TTS</small>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCENES = {
  mcdonalds: {
    panels: [
      { img:"IMG_7558", zh:"你好！我要一份巨无霸套餐。", py:"Nǐ hǎo! Wǒ yào yī fèn jùwúbà tàocān.", ru:"Привет! Мне набор Биг Мак, пожалуйста.", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7559", zh:"嗯…选哪个好呢？", py:"Ńg... xuǎn nǎge hǎo ne?", ru:"Хм… что же выбрать?", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7560", zh:"请给我一个芝士汉堡和大份薯条。", py:"Qǐng gěi wǒ yīgè zhīshì hànbǎo hé dà fèn shǔtiáo.", ru:"Один чизбургер и большую картошку, пожалуйста.", who:"s", speaker:" Покупатель" },
      { img:"IMG_7561", zh:"请问今天有素食选项吗？", py:"Qǐngwèn jīntiān yǒu sùshí xuǎnxiàng ma?", ru:"Подскажите, есть сегодня вегетарианские блюда?", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7562", zh:"我可以扫码支付吗？", py:"Wǒ kěyǐ so mǎ zhīfù ma?", ru:"Можно оплатить по QR-коду?", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7563", zh:"这是您的餐，请慢用！", py:"Zhè shì nín de cān, qǐng màn yòng!", ru:"Вот ваш заказ, приятного аппетита!", who:"w", speaker:"🧑‍🍳 Персонал" },
      { img:"IMG_7564", zh:"哪里有座位？", py:"Nlǐ yǒu zuòwèi?", ru:"Где есть свободные места?", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7565", zh:"真好吃！", py:"Zhēn hǎochī!", ru:"Очень вкусно!", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7566", zh:"好香滑啊！", py:"Ho xiāng huá a!", ru:"Такое нежное и сливочное!", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7567", zh:"再见！谢谢光临！欢迎下次再来！", py:"Zàijiàn! Xièxie guānglín! Huānyíng xiàcì zài lái!", ru:"До свидания! Спасибо, приходите ещё!", who:"s", speaker:" Покупатель" }
    ]
  }
};

let zhVoice = null;
let ruVoice = null;
let currentSpeed = 0.55;
let githubConfig = { token: '', user: '', repo: '' };
let mediaRecorder = null;
let recordedChunks = [];
let currentRecording = null;

// Загрузка голосов
function loadVoices() {
  const voices = speechSynthesis.getVoices();
  zhVoice = voices.find(v => v.lang.includes('zh-CN') || v.lang.includes('cmn')) || voices[0];
  ruVoice = voices.find(v => v.lang.includes('ru-RU')) || voices[0];
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

// Загрузка настроек GitHub из localStorage
function loadGitHubSettings() {
  const saved = localStorage.getItem('githubConfig');
  if (saved) {
    githubConfig = JSON.parse(saved);
    document.getElementById('githubToken').value = githubConfig.token;
    document.getElementById('githubUser').value = githubConfig.user;
    document.getElementById('githubRepo').value = githubConfig.repo;
    const btn = document.getElementById('saveSettingsBtn');
    btn.textContent = '✅ Настройки сохранены';
    btn.classList.add('saved');
  }
}

function saveGitHubSettings() {
  githubConfig.token = document.getElementById('githubToken').value.trim();
  githubConfig.user = document.getElementById('githubUser').value.trim();
  githubConfig.repo = document.getElementById('githubRepo').value.trim();
  
  if (!githubConfig.token || !githubConfig.user || !githubConfig.repo) {
    showToast('⚠️ Заполните все поля!');
    return;
  }
  
  localStorage.setItem('githubConfig', JSON.stringify(githubConfig));
  const btn = document.getElementById('saveSettingsBtn');
  btn.textContent = '✅ Настройки сохранены';
  btn.classList.add('saved');
  showToast('✅ Настройки GitHub сохранены!');
}

// Ползунок скорости
const speedSlider = document.getElementById('speedSlider');
const speedValue = document.getElementById('speedValue');
speedSlider.addEventListener('input', (e) => {
  currentSpeed = parseFloat(e.target.value);
  speedValue.textContent = currentSpeed.toFixed(2) + 'x';
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

// Рендер сцены
function renderScene(key) {
  const data = SCENES[key];
  const container = document.getElementById(`panels-${key}`);
  let html = "";

  data.panels.forEach((p, i) => {
    const bubbleClass = p.who === "w" ? "waiter" : "sailor";
    const speakerClass = p.who === "w" ? "w" : "s";
    const imgSrc = `img/${p.img}.png`;

    html += `
    <div class="panel" id="${key}-p${i}">
      <div class="panel-header">
        <div class="panel-num">
          <span class="panel-num-badge">${i+1}</span>
          ${p.speaker}
        </div>
        <div class="speak-buttons">
          <button class="speak-btn speak-btn-zh" id="${key}-btn-zh-${i}" onclick="speakChinese('${key}',${i})" title="Китайский">🇳</button>
          <button class="record-btn" id="${key}-rec-zh-${i}" onclick="toggleRecording('${key}',${i},'zh')" title="Записать китайский">🎤</button>
          <button class="speak-btn speak-btn-ru" id="${key}-btn-ru-${i}" onclick="speakRussian('${key}',${i})" title="Русский">🇷🇺</button>
          <button class="record-btn" id="${key}-rec-ru-${i}" onclick="toggleRecording('${key}',${i},'ru')" title="Записать русский"></button>
        </div>
      </div>
      <div class="panel-img-wrap" id="${key}-wrap${i}">
        <img class="panel-img" src="${imgSrc}" alt="Панель ${i+1}" onerror="this.parentElement.classList.add('has-error')" />
        <div class="img-error-msg">
          <div class="big">🖼️</div>
          <div><b>${p.img}.png</b> не найден</div>
        </div>
      </div>
      <div class="dialogue">
        <div class="bubble ${bubbleClass}" id="${key}-bub${i}">
          <div class="speaker-tag ${speakerClass}">${p.speaker}</div>
          <div class="zh-text" id="${key}-zh-${i}">${p.zh}</div>
          <div class="py-text">${p.py}</div>
          <div class="ru-text" id="${key}-ru-${i}">${p.ru}</div>
          <div class="audio-player" id="${key}-player-zh-${i}">
            <audio controls id="${key}-audio-zh-${i}"></audio>
          </div>
          <div class="audio-player" id="${key}-player-ru-${i}">
            <audio controls id="${key}-audio-ru-${i}"></audio>
          </div>
          <div class="upload-status" id="${key}-upload-zh-${i}">✅ Загружено на GitHub</div>
          <div class="upload-status" id="${key}-upload-ru-${i}">✅ Загружено на GitHub</div>
        </div>
        <div class="now-playing-bar" id="${key}-np${i}">
          <div class="bars"><span></span><span></span><span></span><span></span></div>
          <span id="${key}-np-text${i}">Идёт озвучка...</span>
        </div>
      </div>
    </div>`;
  });
  container.innerHTML = html;

  // Проверяем наличие записей на GitHub
  checkGitHubRecordings(key);
}

// Проверка записей на GitHub
async function checkGitHubRecordings(key) {
  if (!githubConfig.token) return;
  
  const data = SCENES[key];
  for (let i = 0; i < data.panels.length; i++) {
    for (const lang of ['zh', 'ru']) {
      const filename = `${key}_${lang}_${i}.webm`;
      const path = `audio/${filename}`;
      
      try {
        const response = await fetch(`https://api.github.com/repos/${githubConfig.user}/${githubConfig.repo}/contents/${path}`, {
          headers: { 'Authorization': `token ${githubConfig.token}` }
        });
        
        if (response.ok) {
          const fileData = await response.json();
          const audioUrl = fileData.download_url;
          const audioEl = document.getElementById(`${key}-audio-${lang}-${i}`);
          const playerEl = document.getElementById(`${key}-player-${lang}-${i}`);
          const uploadEl = document.getElementById(`${key}-upload-${lang}-${i}`);
          const recBtn = document.getElementById(`${key}-rec-${lang}-${i}`);
          
          if (audioEl && playerEl && uploadEl && recBtn) {
            audioEl.src = audioUrl;
            playerEl.classList.add('visible');
            uploadEl.classList.add('visible');
            recBtn.classList.add('has-recording');
          }
        }
      } catch (e) {
        // Файл не найден — это нормально
      }
    }
  }
}

// Запись голоса
async function toggleRecording(key, idx, lang) {
  if (!githubConfig.token || !githubConfig.user || !githubConfig.repo) {
    showToast('️ Сначала сохраните настройки GitHub!');
    return;
  }

  const recBtn = document.getElementById(`${key}-rec-${lang}-${idx}`);
  
  if (recBtn.classList.contains('recording')) {
    // Остановить запись
    stopRecording(key, idx, lang);
  } else {
    // Начать запись
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      recordedChunks = [];
      
      mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };
      
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'audio/webm' });
        const audioUrl = URL.createObjectURL(blob);
        const audioEl = document.getElementById(`${key}-audio-${lang}-${idx}`);
        const playerEl = document.getElementById(`${key}-player-${lang}-${idx}`);
        
        if (audioEl && playerEl) {
          audioEl.src = audioUrl;
          playerEl.classList.add('visible');
        }
        
        // Загрузка на GitHub
        uploadToGitHub(blob, key, idx, lang);
        
        stream.getTracks().forEach(track => track.stop());
      };
      
      mediaRecorder.start();
      recBtn.classList.add('recording');
      recBtn.textContent = '⏹';
      showToast(' Запись... Нажмите ещё раз для остановки');
      
      currentRecording = { key, idx, lang };
      
      // Автостоп через 10 секунд
      setTimeout(() => {
        if (recBtn.classList.contains('recording')) {
          stopRecording(key, idx, lang);
        }
      }, 10000);
      
    } catch (err) {
      showToast('⚠️ Ошибка доступа к микрофону!');
    }
  }
}

function stopRecording(key, idx, lang) {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    const recBtn = document.getElementById(`${key}-rec-${lang}-${idx}`);
    if (recBtn) {
      recBtn.classList.remove('recording');
      recBtn.textContent = '🎤';
    }
  }
}

// Загрузка на GitHub
async function uploadToGitHub(blob, key, idx, lang) {
  const filename = `${key}_${lang}_${idx}.webm`;
  const path = `audio/${filename}`;
  
  const reader = new FileReader();
  reader.onload = async () => {
    const base64 = reader.result.split(',')[1];
    
    try {
      // Проверяем, существует ли файл
      let sha = null;
      const checkResponse = await fetch(`https://api.github.com/repos/${githubConfig.user}/${githubConfig.repo}/contents/${path}`, {
        headers: { 'Authorization': `token ${githubConfig.token}` }
      });
      
      if (checkResponse.ok) {
        const existingFile = await checkResponse.json();
        sha = existingFile.sha;
      }
      
      // Загружаем файл
      const body = {
        message: `Add audio recording: ${filename}`,
        content: base64
      };
      
      if (sha) {
        body.sha = sha;
      }
      
      const response = await fetch(`https://api.github.com/repos/${githubConfig.user}/${githubConfig.repo}/contents/${path}`, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${githubConfig.token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      
      if (response.ok) {
        const uploadEl = document.getElementById(`${key}-upload-${lang}-${idx}`);
        const recBtn = document.getElementById(`${key}-rec-${lang}-${idx}`);
        if (uploadEl) uploadEl.classList.add('visible');
        if (recBtn) recBtn.classList.add('has-recording');
        showToast('✅ Загружено на GitHub!');
      } else {
        showToast('❌ Ошибка загрузки!');
      }
    } catch (e) {
      showToast('❌ Ошибка загрузки!');
    }
  };
  reader.readAsDataURL(blob);
}

// Озвучка китайского (с проверкой записи)
function speakChinese(key, idx) {
  const audioEl = document.getElementById(`${key}-audio-zh-${idx}`);
  
  // Если есть запись — используем её
  if (audioEl && audioEl.src) {
    audioEl.play();
    highlightText(key, idx, 'zh');
    audioEl.onended = () => clearHighlight(key, idx, 'zh');
    return;
  }
  
  // Иначе используем TTS
  speechSynthesis.cancel();
  highlightText(key, idx, 'zh');
  
  const p = SCENES[key].panels[idx];
  const zhUtterance = new SpeechSynthesisUtterance(p.zh);
  zhUtterance.lang = "zh-CN";
  zhUtterance.rate = currentSpeed;
  zhUtterance.pitch = p.who === "s" ? 1.15 : 0.9;
  if (zhVoice) zhUtterance.voice = zhVoice;
  
  zhUtterance.onend = () => clearHighlight(key, idx, 'zh');
  zhUtterance.onerror = zhUtterance.onend;
  
  speechSynthesis.speak(zhUtterance);
}

// Озвучка русского (с проверкой записи)
function speakRussian(key, idx) {
  const audioEl = document.getElementById(`${key}-audio-ru-${idx}`);
  
  if (audioEl && audioEl.src) {
    audioEl.play();
    highlightText(key, idx, 'ru');
    audioEl.onended = () => clearHighlight(key, idx, 'ru');
    return;
  }
  
  speechSynthesis.cancel();
  highlightText(key, idx, 'ru');
  
  const p = SCENES[key].panels[idx];
  const ruUtterance = new SpeechSynthesisUtterance(p.ru);
  ruUtterance.lang = "ru-RU";
  ruUtterance.rate = currentSpeed * 1.1;
  if (ruVoice) ruUtterance.voice = ruVoice;
  
  ruUtterance.onend = () => clearHighlight(key, idx, 'ru');
  ruUtterance.onerror = ruUtterance.onend;
  
  speechSynthesis.speak(ruUtterance);
}

function highlightText(key, idx, lang) {
  const textEl = document.getElementById(`${key}-${lang}-${idx}`);
  const panelEl = document.getElementById(`${key}-p${idx}`);
  const btnEl = document.getElementById(`${key}-btn-${lang}-${idx}`);
  const npEl = document.getElementById(`${key}-np${idx}`);
  const npText = document.getElementById(`${key}-np-text${idx}`);
  
  if (textEl) textEl.classList.add('active');
  if (panelEl) panelEl.classList.add('active-panel');
  if (btnEl) btnEl.classList.add('speaking');
  if (npEl) npEl.classList.add('visible');
  if (npText) npText.textContent = lang === 'zh' ? '🇨 Китайский...' : '🇷 Русский...';
}

function clearHighlight(key, idx, lang) {
  const textEl = document.getElementById(`${key}-${lang}-${idx}`);
  const panelEl = document.getElementById(`${key}-p${idx}`);
  const btnEl = document.getElementById(`${key}-btn-${lang}-${idx}`);
  const npEl = document.getElementById(`${key}-np${idx}`);
  
  if (textEl) textEl.classList.remove('active');
  if (panelEl) panelEl.classList.remove('active-panel');
  if (btnEl) btnEl.classList.remove('speaking');
  if (npEl) npEl.classList.remove('visible');
}

// Озвучка всего диалога
const playingState = {};

function playAll(key) {
  if (playingState[key]) { 
    stopScene(key); 
    return; 
  }

  playingState[key] = true;
  const btn = document.getElementById(`playBtn-${key}`);
  btn.textContent = '⏹ Остановить';
  btn.classList.add('playing');

  const panels = SCENES[key].panels;
  let idx = 0;

  function next() {
    if (!playingState[key] || idx >= panels.length) {
      stopScene(key);
      return;
    }

    const panelEl = document.getElementById(`${key}-p${idx}`);
    const npEl = document.getElementById(`${key}-np${idx}`);
    const npText = document.getElementById(`${key}-np-text${idx}`);

    if (panelEl) {
      panelEl.classList.add('active-panel');
      npEl.classList.add('visible');
      panelEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    const p = panels[idx];

    // Китайский
    npText.textContent = '🇨🇳 Китайский...';
    
    const zhAudioEl = document.getElementById(`${key}-audio-zh-${idx}`);
    if (zhAudioEl && zhAudioEl.src) {
      zhAudioEl.play();
      highlightText(key, idx, 'zh');
      zhAudioEl.onended = () => {
        clearHighlight(key, idx, 'zh');
        setTimeout(() => playRussian(key, idx, next), 400);
      };
    } else {
      highlightText(key, idx, 'zh');
      const zhUtterance = new SpeechSynthesisUtterance(p.zh);
      zhUtterance.lang = 'zh-CN';
      zhUtterance.rate = currentSpeed;
      zhUtterance.pitch = p.who === 's' ? 1.15 : 0.9;
      if (zhVoice) zhUtterance.voice = zhVoice;
      zhUtterance.onend = () => {
        clearHighlight(key, idx, 'zh');
        setTimeout(() => playRussian(key, idx, next), 400);
      };
      zhUtterance.onerror = zhUtterance.onend;
      speechSynthesis.speak(zhUtterance);
    }
  }

  function playRussian(key, idx, callback) {
    if (!playingState[key]) return;
    
    const p = panels[idx];
    const npText = document.getElementById(`${key}-np-text${idx}`);
    npText.textContent = '🇷🇺 Русский...';
    
    const ruAudioEl = document.getElementById(`${key}-audio-ru-${idx}`);
    if (ruAudioEl && ruAudioEl.src) {
      ruAudioEl.play();
      highlightText(key, idx, 'ru');
      ruAudioEl.onended = () => {
        clearHighlight(key, idx, 'ru');
        idx++;
        setTimeout(callback, 500);
      };
    } else {
      highlightText(key, idx, 'ru');
      const ruUtterance = new SpeechSynthesisUtterance(p.ru);
      ruUtterance.lang = 'ru-RU';
      ruUtterance.rate = currentSpeed * 1.1;
      if (ruVoice) ruUtterance.voice = ruVoice;
      ruUtterance.onend = () => {
        clearHighlight(key, idx, 'ru');
        idx++;
        setTimeout(callback, 500);
      };
      ruUtterance.onerror = ruUtterance.onend;
      speechSynthesis.speak(ruUtterance);
    }
  }

  next();
}

function stopScene(key) {
  speechSynthesis.cancel();
  playingState[key] = false;
  
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active-panel'));
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  document.querySelectorAll('.now-playing-bar').forEach(n => n.classList.remove('visible'));
  document.querySelectorAll('.zh-text, .ru-text').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('audio').forEach(a => a.pause());
  
  const btn = document.getElementById(`playBtn-${key}`);
  if (btn) {
    btn.textContent = '▶ Озвучить весь диалог';
    btn.classList.remove('playing');
  }
}

// Инициализация
window.addEventListener('load', () => {
  renderScene('mcdonalds');
  loadGitHubSettings();
  
  if (!('speechSynthesis' in window)) {
    showToast('⚠️ Используйте Google Chrome для озвучки!');
  }
});
</script>
