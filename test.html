<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔧 Диагностика Bejdialog</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;background:#f5f5f5;padding:16px;color:#222;line-height:1.5;margin:0}
h1{font-size:20px;margin:0 0 16px 0}
.test{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.test h2{font-size:15px;margin:0 0 8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.status{font-size:12px;padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap}
.pending{background:#eee;color:#666}
.running{background:#fff3cd;color:#856404}
.ok{background:#d4edda;color:#155724}
.fail{background:#f8d7da;color:#721c24}
.warn{background:#fff3cd;color:#856404}
.result{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f8f8f8;padding:8px;border-radius:6px;margin-top:8px;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto}
.btn{background:#007aff;color:#fff;border:none;padding:12px 20px;border-radius:10px;font-size:15px;font-weight:600;width:100%;margin-bottom:16px;cursor:pointer}
.btn:active{opacity:.7}
.copy{background:#4caf50;margin-top:16px}
.critical{border-left:4px solid #dc3545}
</style>
</head>
<body>

<h1>🔧 Диагностика Bejdialog</h1>

<div class="test critical">
  <h2>⚙️ Настройка <span class="status pending" id="s-config">...</span></h2>
  <div class="result" id="r-config"></div>
</div>

<button class="btn" onclick="runAll()">▶️ Запустить все тесты</button>

<div class="test">
  <h2>1. Worker: базовый ответ <span class="status pending" id="s-worker">...</span></h2>
  <div class="result" id="r-worker">Не проверено</div>
</div>

<div class="test">
  <h2>2. Worker: чтение записи <span class="status pending" id="s-read">...</span></h2>
  <div class="result" id="r-read">Не проверено</div>
</div>

<div class="test">
  <h2>3. Worker: CORS <span class="status pending" id="s-cors">...</span></h2>
  <div class="result" id="r-cors">Не проверено</div>
</div>

<div class="test">
  <h2>4. Микрофон <span class="status pending" id="s-mic">...</span></h2>
  <div class="result" id="r-mic">Не проверено</div>
</div>

<div class="test">
  <h2>5. Устройство <span class="status pending" id="s-device">...</span></h2>
  <div class="result" id="r-device">Не проверено</div>
</div>

<button class="btn copy" onclick="copyAll()">📋 Скопировать весь отчёт</button>

<script>
const WORKER_URL = 'https://bejdialog.meledy1111.workers.dev';
const results = {};

function setStatus(id, status, text) {
  document.getElementById('s-' + id).className = 'status ' + status;
  document.getElementById('s-' + id).textContent = text;
}
function setResult(id, text) {
  document.getElementById('r-' + id).textContent = text;
  results[id] = text;
}

async function runAll() {
  setStatus('config', 'ok', 'OK');
  setResult('config', 'Worker URL: ' + WORKER_URL);

  // 1. Worker базовый
  try {
    setStatus('worker', 'running', '...');
    const url = WORKER_URL + '/recordings/test.webm';
    const start = Date.now();
    const res = await fetch(url, { method: 'GET', cache: 'no-cache' });
    const elapsed = Date.now() - start;
    const text = await res.text();
    const ok = res.status === 404 && text.includes('Not found');
    setStatus('worker', ok ? 'ok' : 'fail', 'HTTP ' + res.status);
    setResult('worker', 'URL: ' + url + '\nВремя: ' + elapsed + 'мс\nСтатус: ' + res.status + '\nОтвет: ' + text.substring(0, 200));
  } catch(e) {
    setStatus('worker', 'fail', 'ОШИБКА');
    setResult('worker', 'Не удалось связаться с Worker.\nURL: ' + WORKER_URL + '/recordings/test.webm\nОшибка: ' + e.message);
  }

  // 2. Worker чтение
  try {
    setStatus('read', 'running', '...');
    const url = WORKER_URL + '/recordings/mcdonalds_ru_0.webm';
    const res = await fetch(url, { method: 'GET', cache: 'no-cache' });
    if (res.status === 404) {
      setStatus('read', 'warn', 'HTTP 404');
      setResult('read', 'HTTP 404 — записи нет (нормально, если ещё не писали)');
    } else if (res.ok) {
      const blob = await res.blob();
      setStatus('read', 'ok', 'HTTP ' + res.status);
      setResult('read', 'HTTP ' + res.status + '\nРазмер: ' + blob.size + ' байт\nТип: ' + blob.type);
    } else {
      setStatus('read', 'fail', 'HTTP ' + res.status);
      setResult('read', 'HTTP ' + res.status + '\n' + (await res.text()).substring(0, 200));
    }
  } catch(e) {
    setStatus('read', 'fail', 'ОШИБКА');
    setResult('read', 'Ошибка: ' + e.message);
  }

  // 3. CORS
  try {
    setStatus('cors', 'running', '...');
    const url = WORKER_URL + '/recordings/test.webm';
    const res = await fetch(url, {
      method: 'OPTIONS',
      headers: {
        'Access-Control-Request-Method': 'PUT',
        'Access-Control-Request-Headers': 'content-type,x-upload-key'
      }
    });
    const allow = res.headers.get('access-control-allow-origin');
    setStatus('cors', allow === '*' ? 'ok' : 'fail', allow || 'НЕТ');
    setResult('cors', 'Статус: ' + res.status + '\nAllow-Origin: ' + (allow || '(нет)'));
  } catch(e) {
    setStatus('cors', 'fail', 'ОШИБКА');
    setResult('cors', 'Ошибка: ' + e.message);
  }

  // 4. Микрофон
  try {
    setStatus('mic', 'running', '...');
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const track = stream.getAudioTracks()[0];
    setStatus('mic', 'ok', 'OK');
    setResult('mic', 'Разрешён\nУстройство: ' + (track ? track.label : '?'));
    stream.getTracks().forEach(t => t.stop());
  } catch(e) {
    setStatus('mic', 'fail', 'ОТКАЗ');
    setResult('mic', 'Ошибка: ' + e.name + ' — ' + e.message + '\n\nЧто делать:\n- Safari → Настройки iPhone → Safari → Микрофон → Разрешить\n- Или тап на замок в адресной строке → Микрофон → Разрешить');
  }

  // 5. Устройство
  try {
    const ua = navigator.userAgent;
    const isIOS = /iPad|iPhone|iPod/.test(ua);
    const browser = /CriOS/.test(ua) ? 'Chrome iOS' : /Safari/.test(ua) ? 'Safari' : 'другой';
    setStatus('device', 'ok', isIOS ? 'iOS' : 'Android/другое');
    setResult('device', 'Браузер: ' + browser + '\nOnline: ' + navigator.onLine + '\nUA: ' + ua);
  } catch(e) {
    setStatus('device', 'fail', 'ОШИБКА');
    setResult('device', String(e));
  }

  setTimeout(() => document.querySelector('.copy').scrollIntoView({behavior:'smooth'}), 500);
}

function copyAll() {
  let r = '=== ДИАГНОСТИКА ===\n' + new Date().toISOString() + '\n\n';
  for (const [k, v] of Object.entries(results)) r += '--- ' + k + ' ---\n' + v + '\n\n';
  navigator.clipboard.writeText(r).then(() => alert('✅ Скопировано')).catch(() => alert('❌ Скопируйте вручную'));
}

window.addEventListener('load', () => setTimeout(runAll, 300));
</script>
</body>
</html>
