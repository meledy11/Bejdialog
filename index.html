<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍔 McDonald's — Учим китайский</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Comfortaa:wght@400;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      height: 100%;
      overflow: hidden;
    }
    
    body {
      background: linear-gradient(180deg, #fff8f0 0%, #ffe8d6 50%, #ffd6b3 100%);
      font-family: 'Comfortaa', 'Noto Sans SC', sans-serif;
      overscroll-behavior: none;
    }
    
    .manga-container {
      max-width: 100%;
      height: 100vh;
      overflow-y: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    
    .scene-title {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: linear-gradient(135deg, #da291c, #ff4b2b, #ffc72c);
      padding: 12px 18px;
      text-align: center;
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .scene-title h1 { font-size: 16px; margin-bottom: 2px; }
    .scene-title p { font-size: 11px; opacity: 0.9; }
    
    .speed-control {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(255,255,255,0.98);
      padding: 10px 18px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .speed-label { font-weight: 700; color: #da291c; font-size: 11px; }
    .speed-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, #da291c, #ffc72c);
    }
    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: white;
      border: 3px solid #da291c;
    }
    .speed-value {
      font-weight: 700; color: #da291c; font-size: 12px;
      min-width: 45px; text-align: center;
    }

    .panel {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 70px 20px 80px;
      background: linear-gradient(180deg, #fff8f0 0%, #ffe8d6 100%);
      position: relative;
    }
    
    .panel-inner {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(218,41,28,0.12);
      border: 2px solid #ffd6b3;
      max-width: 600px;
      width: 100%;
      overflow: hidden;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }
    
    .panel.active-panel .panel-inner {
      border-color: #da291c;
      box-shadow: 0 8px 32px rgba(218,41,28,0.2);
    }
    
    .panel.recording-panel .panel-inner {
      border-color: #f44336;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #fffaf8;
      border-bottom: 1px dashed #ffd6b3;
    }
    .panel-num {
      font-weight: 700; color: #da291c; font-size: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-num-badge {
      background: linear-gradient(135deg, #da291c, #ffc72c);
      color: white;
      width: 28px; height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .speak-buttons { display: flex; gap: 8px; align-items: center; }
    
    .action-btn {
      border: none;
      width: 38px; height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      transition: opacity 0.2s ease;
      color: white;
      position: relative;
    }
    .action-btn:active { opacity: 0.7; }
    
    .speak-btn-zh { background: linear-gradient(135deg, #da291c, #ff6b6b); }
    .speak-btn-ru { background: linear-gradient(135deg, #4a90e2, #67b26f); }
    
    .speak-btn.speaking { 
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }
    
    .record-btn { background: linear-gradient(135deg, #ff9800, #f57c00); }
    .record-btn.recording { 
      opacity: 0.8;
    }
    .record-btn.has-recording { background: linear-gradient(135deg, #4CAF50, #67b26f); }
    
    .replay-btn { background: #eee; color: #888; border: 1px solid #ddd; }
    .replay-btn.playing { opacity: 0.7; }

    .delete-overlay {
      position: absolute;
      top: -2px; right: -2px;
      width: 16px; height: 16px;
      background: #f44336;
      border: 2px solid white;
      border-radius: 50%;
      font-size: 9px;
      display: none;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .record-btn.has-recording .delete-overlay { display: flex; }

    .panel-img-wrap {
      position: relative;
      background: linear-gradient(135deg, #fff8f0, #ffe8d6);
      overflow: hidden;
      border-top: 1px dashed #ffd6b3;
      border-bottom: 1px dashed #ffd6b3;
    }
    .panel-img { 
      width: 100%; 
      display: block;
      max-height: 45vh;
      object-fit: contain;
    }
    .img-error-msg {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: #cc6644;
      text-align: center;
      padding: 20px;
    }
    .img-error-msg .big { font-size: 50px; }
    .panel-img-wrap.has-error .panel-img { display: none; }
    .panel-img-wrap.has-error .img-error-msg { display: flex; }

    .dialogue { padding: 20px 18px; }
    .bubble {
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 16px;
      border: 2px solid transparent;
    }
    .bubble.waiter { background: linear-gradient(135deg, #f0f8ff, #fff); border-color: #99ccff; }
    .bubble.sailor { background: linear-gradient(135deg, #fff5f8, #fff); border-color: #ffb3cc; }
    .speaker-tag { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
    .speaker-tag.w { color: #4488cc; }
    .speaker-tag.s { color: #cc4488; }
    
    .zh-text {
      font-family: 'Noto Sans SC', sans-serif; 
      font-size: 32px;
      font-weight: 700;
      color: #2a2a2a; 
      margin-bottom: 10px;
      line-height: 1.5;
      letter-spacing: 2px;
      padding: 10px 14px;
      border-radius: 12px;
      transition: background-color 0.4s ease, color 0.4s ease;
      background: white;
      text-align: center;
    }
    .zh-text.active {
      background: #ffc72c;
      color: #da291c;
    }
    .py-text {
      font-size: 17px;
      color: #888;
      font-style: italic;
      margin-bottom: 12px;
      font-weight: 600;
      text-align: center;
    }
    .ru-text {
      font-size: 18px;
      color: #555;
      line-height: 1.5;
      padding: 10px 14px;
      border-left: 4px solid #ffd6b3;
      border-radius: 12px;
      transition: background-color 0.4s ease, color 0.4s ease;
      background: white;
      text-align: center;
    }
    .ru-text.active {
      background: #4a90e2;
      color: white;
      border-left-color: #2c5aa0;
    }

    .next-card-btn {
      display: block;
      margin: 10px auto 0;
      padding: 8px 18px;
      background: transparent;
      color: #bbb;
      border: 1px solid #e0e0e0;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      opacity: 0.6;
    }
    .next-card-btn:hover {
      opacity: 1;
      background: #fff8f0;
      border-color: #ffc72c;
      color: #da291c;
    }
    .next-card-btn:active { opacity: 0.5; }
    .next-card-btn.playing {
      opacity: 0.3;
      pointer-events: none;
    }

    .now-playing-bar {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #da291c;
      font-weight: 700;
      padding: 6px 14px;
      background: #fff0f0;
      border-radius: 20px;
      margin-top: 12px;
      justify-content: center;
    }
    .now-playing-bar.visible { display: inline-flex; }
    
    .bars { display: flex; gap: 3px; align-items: flex-end; height: 14px; }
    .bars span {
      width: 4px;
      background: #da291c;
      border-radius: 2px;
      animation: barAnim 1.2s ease-in-out infinite;
    }
    .bars span:nth-child(1){height:5px;animation-delay:0s}
    .bars span:nth-child(2){height:10px;animation-delay:.2s}
    .bars span:nth-child(3){height:6px;animation-delay:.4s}
    .bars span:nth-child(4){height:12px;animation-delay:.1s}
    @keyframes barAnim { 
      0%,100%{transform:scaleY(1)} 
      50%{transform:scaleY(0.5)} 
    }

    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(40,15,50,0.95);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-family: inherit;
      z-index: 999;
      transition: transform 0.4s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    
    .manga-container::-webkit-scrollbar { display: none; }
    .manga-container { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>

<div class="scene-title">
  <h1>🍔 在麦当劳 — Диалог в McDonald's</h1>
  <p>Листайте вниз для перехода между карточками</p>
</div>

<div class="manga-container" id="panels-mcdonalds"></div>

<div class="speed-control">
  <div class="speed-label">🐢 Скорость:</div>
  <input type="range" id="speedSlider" class="speed-slider" min="0.3" max="1.0" step="0.05" value="0.55">
  <div class="speed-value" id="speedValue">0.55x</div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCENES = {
  mcdonalds: {
    panels: [
      { img:"IMG_7558", zh:"你好！我要一份巨无霸套餐。", py:"Nǐ hǎo! Wǒ yào yī fèn jùwúbà tàocān.", ru:"Привет! Мне набор Биг Мак, пожалуйста.", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7559", zh:"嗯…选哪个好呢？", py:"Ńg... xuǎn nǎge hǎo ne?", ru:"Хм… что же выбрать?", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7560", zh:"请给我一个芝士汉堡和大份薯条。", py:"Qǐng gěi wǒ yīgè zhīshì hànbǎo hé dà fèn shǔtiáo.", ru:"Один чизбургер и большую картошку, пожалуйста.", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7561", zh:"请问今天有素食选项吗？", py:"Qǐngwèn jīntiān yǒu sùshí xuǎnxiàng ma?", ru:"Подскажите, есть сегодня вегетарианские блюда?", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7587", zh:"有的，我们有蔬菜汉堡和沙拉。", py:"Yǒu de, wǒmen yǒu shūcài hànbǎo hé shālā.", ru:"Да, у нас есть овощной бургер и салат.", who:"w", speaker:"🧑‍ Персонал" },
      { img:"IMG_7588", zh:"那我要一个蔬菜汉堡！", py:"Nà wǒ yào yīgè shūcài hànbǎo!", ru:"Тогда мне один овощной бургер!", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7562", zh:"我可以扫码支付吗？", py:"Wǒ kěyǐ sǎo mǎ zhīfù ma?", ru:"Можно оплатить по QR-коду?", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7586", zh:"可以，我们接受支付宝、微信和现金。", py:"Kěyǐ, wǒmen jiēshòu zhīfùbǎo, wēixìn hé xiànjīn.", ru:"Да, мы принимаем Alipay, WeChat и наличные.", who:"w", speaker:"🧑‍🍳 Персонал" },
      { img:"IMG_7589", zh:"这是您的餐，请慢用！", py:"Zhè shì nín de cān, qǐng màn yòng!", ru:"Вот ваш заказ, приятного аппетита!", who:"w", speaker:"🧑‍🍳 Персонал" },
      { img:"IMG_7590", zh:"哪里有座位？", py:"Nǎlǐ yǒu zuòwèi?", ru:"Где есть свободные места?", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7565", zh:"真好吃！", py:"Zhēn hǎochī!", ru:"Очень вкусно!", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7591", zh:"再来一个冰淇淋！", py:"Zài lái yīgè bīngqílín!", ru:"Ещё одно мороженое!", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7566", zh:"好香滑啊！", py:"Hǎo xiāng huá a!", ru:"Такое нежное и сливочное!", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7567", zh:"再见！谢谢光临！欢迎下次再来！", py:"Zàijiàn! Xièxie guānglín! Huānyíng xiàcì zài lái!", ru:"До свидания! Спасибо, приходите ещё!", who:"s", speaker:"👧 Покупатель" }
    ]
  }
};

let zhVoice = null;
let ruVoice = null;
let currentSpeed = 0.55;
let db = null;
let isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
let activeRecorder = null;
let activeStream = null;
let activeRecordingKey = null;
let recordingTimeout = null;

function wakeUpSpeechSynthesis() {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  if (isIOS) speechSynthesis.resume();
  const dummy = new SpeechSynthesisUtterance(' ');
  dummy.volume = 0; dummy.rate = 2;
  speechSynthesis.speak(dummy);
  return new Promise(resolve => setTimeout(resolve, 150));
}

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('McDonaldsAudio_v16', 1);
    request.onupgradeneeded = (event) => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains('recordings')) db.createObjectStore('recordings');
    };
    request.onsuccess = (event) => { db = event.target.result; resolve(db); };
    request.onerror = (event) => reject(event.target.error);
  });
}

function saveToDB(key, blob) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(['recordings'], 'readwrite');
    const req = tx.objectStore('recordings').put(blob, key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function getFromDB(key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(['recordings'], 'readonly');
    const req = tx.objectStore('recordings').get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function deleteFromDB(key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(['recordings'], 'readwrite');
    const req = tx.objectStore('recordings').delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function loadVoices() {
  const voices = speechSynthesis.getVoices();
  zhVoice = voices.find(v => v.lang.includes('zh-CN') || v.lang.includes('cmn')) || voices[0];
  ruVoice = voices.find(v => v.lang.includes('ru-RU')) || voices[0];
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

document.getElementById('speedSlider').addEventListener('input', (e) => {
  currentSpeed = parseFloat(e.target.value);
  document.getElementById('speedValue').textContent = currentSpeed.toFixed(2) + 'x';
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function resetAllRecordButtons() {
  document.querySelectorAll('.record-btn').forEach(btn => {
    btn.classList.remove('recording');
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('recording-panel'));
}

async function renderScene(key) {
  const data = SCENES[key];
  const container = document.getElementById(`panels-${key}`);
  let html = "";

  data.panels.forEach((p, i) => {
    const bubbleClass = p.who === "w" ? "waiter" : "sailor";
    const speakerClass = p.who === "w" ? "w" : "s";
    const imgSrc = `img/${p.img}.png`;
    const isLast = i === data.panels.length - 1;

    html += `
    <div class="panel" id="${key}-p${i}">
      <div class="panel-inner">
        <div class="panel-header">
          <div class="panel-num">
            <span class="panel-num-badge">${i+1}</span>
            ${p.speaker}
          </div>
          <div class="speak-buttons">
            <button class="action-btn replay-btn" id="${key}-replay-${i}" onclick="playCard('${key}',${i})" title="Повторить">🔊</button>
            <button class="action-btn speak-btn speak-btn-zh" id="${key}-btn-zh-${i}" onclick="handleSpeak('${key}',${i},'zh')" title="Только китайский">🇨🇳</button>
            <button class="action-btn speak-btn speak-btn-ru" id="${key}-btn-ru-${i}" onclick="handleSpeak('${key}',${i},'ru')" title="Только русский">🇷🇺</button>
            <button class="action-btn record-btn" id="${key}-rec-ru-${i}" onclick="toggleRecording('${key}',${i},'ru')" title="Записать русский">
              🎤<span class="delete-overlay" onclick="event.stopPropagation(); handleDelete('${key}',${i},'ru')">✕</span>
            </button>
          </div>
        </div>
        <div class="panel-img-wrap" id="${key}-wrap${i}">
          <img class="panel-img" src="${imgSrc}" alt="Panel ${i+1}" onerror="this.parentElement.classList.add('has-error')" />
          <div class="img-error-msg"><div class="big">🖼️</div><div><b>${p.img}.png</b> не найден</div></div>
        </div>
        <div class="dialogue">
          <div class="bubble ${bubbleClass}" id="${key}-bub${i}">
            <div class="speaker-tag ${speakerClass}">${p.speaker}</div>
            <div class="zh-text" id="${key}-zh-${i}">${p.zh}</div>
            <div class="py-text">${p.py}</div>
            <div class="ru-text" id="${key}-ru-${i}">${p.ru}</div>
          </div>
          <div class="now-playing-bar" id="${key}-np${i}">
            <div class="bars"><span></span><span></span><span></span><span></span></div>
            <span id="${key}-np-text${i}">Идёт озвучка...</span>
          </div>
          <button class="next-card-btn" id="${key}-next-${i}" onclick="playAndNext('${key}',${i})">
            ${isLast ? '↻ в начало' : '→ далее'}
          </button>
        </div>
      </div>
    </div>`;
  });
  container.innerHTML = html;
  await checkRecordings(key);
}

async function checkRecordings(key) {
  const data = SCENES[key];
  for (let i = 0; i < data.panels.length; i++) {
    try {
      const blob = await getFromDB(`${key}_ru_${i}`);
      if (blob) {
        const recBtn = document.getElementById(`${key}-rec-ru-${i}`);
        if (recBtn) recBtn.classList.add('has-recording');
      }
    } catch(e) {}
  }
}

async function toggleRecording(key, idx, lang) {
  const recBtn = document.getElementById(`${key}-rec-${lang}-${idx}`);
  const panelEl = document.getElementById(`${key}-p${idx}`);
  
  if (activeRecordingKey && activeRecordingKey.key === key && activeRecordingKey.idx === idx) {
    stopCurrentRecording();
    return;
  }
  if (activeRecordingKey) {
    stopCurrentRecording();
    await sleep(300);
  }
  
  try {
    resetAllRecordButtons();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    activeStream = stream;
    
    let mimeType = 'audio/webm';
    if (isIOS && MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
    
    const recorder = new MediaRecorder(stream, { mimeType });
    activeRecorder = recorder;
    activeRecordingKey = { key, idx, lang };
    const chunks = [];
    
    recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = async () => {
      const blob = new Blob(chunks, { type: mimeType });
      try {
        await saveToDB(`${key}_${lang}_${idx}`, blob);
        document.getElementById(`${key}-rec-${lang}-${idx}`).classList.add('has-recording');
        showToast('✅ Сохранено!');
      } catch(e) { showToast('❌ Ошибка'); }
      if (activeStream) { activeStream.getTracks().forEach(t => t.stop()); activeStream = null; }
      activeRecorder = null; activeRecordingKey = null;
      resetAllRecordButtons();
    };
    recorder.onerror = () => { showToast('❌ Ошибка записи'); cleanupRecording(); };
    
    recBtn.classList.add('recording');
    if (panelEl) panelEl.classList.add('recording-panel');
    
    recorder.start();
    showToast('🔴 Запись...');
    recordingTimeout = setTimeout(() => { if (activeRecordingKey?.idx === idx) stopCurrentRecording(); }, 15000);
  } catch (err) { showToast('⚠️ Нет доступа к микрофону'); cleanupRecording(); }
}

function stopCurrentRecording() {
  if (recordingTimeout) clearTimeout(recordingTimeout);
  if (activeRecorder && activeRecorder.state !== 'inactive') {
    try { activeRecorder.stop(); } catch(e) { cleanupRecording(); }
  } else { cleanupRecording(); }
}

function cleanupRecording() {
  if (recordingTimeout) clearTimeout(recordingTimeout);
  if (activeStream) { activeStream.getTracks().forEach(t => t.stop()); activeStream = null; }
  activeRecorder = null; activeRecordingKey = null;
  resetAllRecordButtons();
}

async function handleDelete(key, idx, lang) {
  try {
    await deleteFromDB(`${key}_${lang}_${idx}`);
    document.getElementById(`${key}-rec-${lang}-${idx}`).classList.remove('has-recording');
    showToast('🗑️ Удалено');
  } catch(e) {}
}

function playTTSRobust(key, idx, lang) {
  return new Promise(async (resolve) => {
    highlightText(key, idx, lang);
    const p = SCENES[key].panels[idx];
    const text = lang === 'zh' ? p.zh : p.ru;
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang === 'zh' ? "zh-CN" : "ru-RU";
    utterance.rate = lang === 'zh' ? currentSpeed : currentSpeed * 1.1;
    utterance.pitch = (lang === 'zh' && p.who === "s") ? 1.15 : 0.9;
    if (lang === 'zh' && zhVoice) utterance.voice = zhVoice;
    if (lang === 'ru' && ruVoice) utterance.voice = ruVoice;
    
    let finished = false;
    const finish = () => { if(finished) return; finished=true; clearHighlight(key, idx, lang); resolve(); };
    
    const maxDuration = Math.min((text.length * 400) / (lang === 'zh' ? currentSpeed : currentSpeed * 1.1) + 3000, 20000);
    const safetyTimeout = setTimeout(finish, maxDuration);
    utterance.onend = () => { clearTimeout(safetyTimeout); finish(); };
    utterance.onerror = () => { clearTimeout(safetyTimeout); finish(); };
    
    await wakeUpSpeechSynthesis();
    setTimeout(() => { if (!finished) speechSynthesis.speak(utterance); }, 100);
  });
}

function playRecordingRobust(blob, key, idx, lang) {
  return new Promise((resolve) => {
    const audio = new Audio(URL.createObjectURL(blob));
    audio.playsInline = true;
    highlightText(key, idx, lang);
    let finished = false;
    const finish = () => { if(finished) return; finished=true; clearHighlight(key, idx, lang); resolve(); };
    const safetyTimeout = setTimeout(finish, 10000);
    audio.onended = () => { clearTimeout(safetyTimeout); finish(); };
    audio.onerror = () => { clearTimeout(safetyTimeout); finish(); };
    audio.play().catch(() => { clearTimeout(safetyTimeout); finish(); });
  });
}

function highlightText(key, idx, lang) {
  const el = document.getElementById(`${key}-${lang}-${idx}`);
  const panel = document.getElementById(`${key}-p${idx}`);
  const btn = document.getElementById(`${key}-btn-${lang}-${idx}`);
  const np = document.getElementById(`${key}-np${idx}`);
  const npT = document.getElementById(`${key}-np-text${idx}`);
  const replayBtn = document.getElementById(`${key}-replay-${idx}`);
  const nextBtn = document.getElementById(`${key}-next-${idx}`);
  
  if(el) el.classList.add('active');
  if(panel) panel.classList.add('active-panel');
  if(btn) btn.classList.add('speaking');
  if(replayBtn) replayBtn.classList.add('playing');
  if(nextBtn) nextBtn.classList.add('playing');
  if(np) np.classList.add('visible');
  if(npT) npT.textContent = lang === 'zh' ? '🇨🇳 Китайский...' : '🇷🇺 Русский...';
}

function clearHighlight(key, idx, lang) {
  const el = document.getElementById(`${key}-${lang}-${idx}`);
  const panel = document.getElementById(`${key}-p${idx}`);
  const btn = document.getElementById(`${key}-btn-${lang}-${idx}`);
  const np = document.getElementById(`${key}-np${idx}`);
  const replayBtn = document.getElementById(`${key}-replay-${idx}`);
  const nextBtn = document.getElementById(`${key}-next-${idx}`);
  
  if(el) el.classList.remove('active');
  if(panel) panel.classList.remove('active-panel');
  if(btn) btn.classList.remove('speaking');
  if(replayBtn) replayBtn.classList.remove('playing');
  if(nextBtn) nextBtn.classList.remove('playing');
  if(np) np.classList.remove('visible');
}

async function handleSpeak(key, idx, lang) {
  await wakeUpSpeechSynthesis();
  if (lang === 'zh') await playTTSRobust(key, idx, 'zh');
  else {
    try {
      const blob = await getFromDB(`${key}_ru_${idx}`);
      if (blob) await playRecordingRobust(blob, key, idx, 'ru');
      else await playTTSRobust(key, idx, 'ru');
    } catch(e) { await playTTSRobust(key, idx, 'ru'); }
  }
}

async function playCard(key, idx) {
  const btn = document.getElementById(`${key}-replay-${idx}`);
  if (btn) btn.classList.add('playing');
  
  await wakeUpSpeechSynthesis();
  await playTTSRobust(key, idx, 'zh');
  await sleep(500);
  await wakeUpSpeechSynthesis();
  
  try {
    const blob = await getFromDB(`${key}_ru_${idx}`);
    if (blob) {
      await playRecordingRobust(blob, key, idx, 'ru');
      await wakeUpSpeechSynthesis();
    } else {
      await playTTSRobust(key, idx, 'ru');
    }
  } catch(e) { await playTTSRobust(key, idx, 'ru'); }
  
  if (btn) btn.classList.remove('playing');
}

async function playAndNext(key, idx) {
  const panels = SCENES[key].panels;
  await playCard(key, idx);
  
  let nextIdx = idx + 1;
  if (nextIdx >= panels.length) {
    nextIdx = 0;
    showToast('🔄 Начинаем сначала');
  }
  
  const nextPanel = document.getElementById(`${key}-p${nextIdx}`);
  if (nextPanel) {
    setTimeout(() => {
      nextPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 300);
  }
}

function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

window.addEventListener('load', async () => {
  await initDB();
  renderScene('mcdonalds');
  if (!('speechSynthesis' in window)) showToast('⚠️ Используйте Chrome/Safari');
});
</script>
