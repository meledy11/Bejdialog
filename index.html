<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍔 McDonald's — Учим китайский с подсветкой</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Comfortaa:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(180deg, #fff8f0 0%, #ffe8d6 50%, #ffd6b3 100%);
      font-family: 'Comfortaa', 'Noto Sans SC', sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .manga-container { max-width: 600px; margin: 0 auto; padding: 0 12px; }

    .scene-title {
      border-radius: 20px; padding: 22px 18px; text-align: center;
      margin: 15px 0 18px; 
      background: linear-gradient(135deg, #da291c, #ff4b2b, #ffc72c);
      box-shadow: 0 8px 32px rgba(218,41,28,0.25);
      position: relative; overflow: hidden; color: white;
    }
    .scene-title h1 { font-size: 20px; margin-bottom: 5px; text-shadow: 2px 2px 8px rgba(0,0,0,0.2); }
    .scene-title p  { font-size: 13px; opacity: 0.95; margin-bottom: 14px; }

    .play-all-btn {
      background: white; color: #da291c; border: none;
      padding: 10px 24px; border-radius: 30px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .play-all-btn:hover  { transform: scale(1.05); }
    .play-all-btn.playing { background: #ffe8d6; color: #da291c; }

    .panel {
      background: white; border-radius: 16px; margin-bottom: 16px;
      overflow: hidden; box-shadow: 0 4px 20px rgba(218,41,28,0.1);
      border: 2px solid #ffd6b3; transition: all 0.3s;
    }
    .panel.active-panel {
      border-color: #da291c;
      box-shadow: 0 0 0 3px rgba(218,41,28,0.15), 0 8px 30px rgba(255,199,44,0.25);
      transform: scale(1.01);
    }

    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: #fffaf8;
      border-bottom: 1px dashed #ffd6b3;
    }
    .panel-num {
      font-weight: 700; color: #da291c; font-size: 13px;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-num-badge {
      background: linear-gradient(135deg, #da291c, #ffc72c); color: white;
      width: 24px; height: 24px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px;
    }

    .speak-btn {
      background: linear-gradient(135deg, #da291c, #ff6b6b); color: white;
      border: none; width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 16px; transition: 0.2s; flex-shrink: 0;
    }
    .speak-btn:hover  { transform: scale(1.15); }
    .speak-btn.speaking { animation: pulse 0.9s ease-in-out infinite; }
    @keyframes pulse {
      0%,100%{box-shadow:0 0 0 0 rgba(218,41,28,0.45)}
      50%{box-shadow:0 0 0 10px rgba(218,41,28,0)}
    }

    .panel-img-wrap {
      position: relative; background: linear-gradient(135deg, #fff8f0, #ffe8d6);
      min-height: 150px; overflow: hidden;
      border-top: 1px dashed #ffd6b3; border-bottom: 1px dashed #ffd6b3;
    }
    .panel-img { width: 100%; display: block; transition: transform 0.4s; }
    .panel:hover .panel-img { transform: scale(1.02); }
    .img-error-msg {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center; flex-direction: column;
      gap: 8px; color: #cc6644; text-align: center; padding: 20px; font-size: 13px;
    }
    .img-error-msg .big { font-size: 40px; }
    .panel-img-wrap.has-error .panel-img     { display: none; }
    .panel-img-wrap.has-error .img-error-msg { display: flex; }

    .dialogue { padding: 18px 16px; }

    .bubble {
      padding: 16px; border-radius: 14px; margin-bottom: 14px;
      border: 2px solid transparent; transition: all 0.3s;
    }
    .bubble.waiter { background: linear-gradient(135deg, #f0f8ff, #fff); border-color: #99ccff; }
    .bubble.sailor { background: linear-gradient(135deg, #fff5f8, #fff); border-color: #ffb3cc; }
    .bubble.highlight { filter: brightness(1.05) saturate(1.1); transform: scale(1.01); }

    .speaker-tag {
      font-size: 12px; font-weight: 700; margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .speaker-tag.w { color: #4488cc; }
    .speaker-tag.s { color: #cc4488; }

    .zh-text {
      font-family: 'Noto Sans SC', sans-serif; 
      font-size: 24px; font-weight: 700; color: #2a2a2a; 
      margin-bottom: 8px; line-height: 1.8;
    }
    .zh-char {
      display: inline-block; padding: 2px 4px; border-radius: 6px;
      transition: all 0.15s ease;
    }
    .zh-char.active {
      background: #ffc72c; color: #da291c;
      transform: scale(1.25); font-weight: 900;
      box-shadow: 0 2px 8px rgba(255, 199, 44, 0.6);
    }

    .py-text { 
      font-size: 15px; color: #888; font-style: italic; 
      margin-bottom: 10px; font-weight: 600;
    }

    .ru-text {
      font-size: 15px; color: #555; line-height: 1.6;
      padding-left: 12px; border-left: 4px solid #ffd6b3;
    }
    .ru-word {
      display: inline-block; padding: 2px 4px; border-radius: 6px;
      transition: all 0.15s ease;
    }
    .ru-word.active {
      background: #da291c; color: white;
      transform: scale(1.1); font-weight: 700;
      box-shadow: 0 2px 8px rgba(218, 41, 28, 0.4);
    }

    .now-playing-bar {
      display: none; align-items: center; gap: 8px;
      font-size: 12px; color: #da291c; font-weight: 700;
      padding: 6px 14px; background: #fff0f0;
      border-radius: 20px; margin-top: 12px;
    }
    .now-playing-bar.visible { display: inline-flex; }
    .bars { display: flex; gap: 3px; align-items: flex-end; height: 14px; }
    .bars span {
      width: 4px; background: #da291c; border-radius: 2px;
      animation: barAnim 0.6s ease-in-out infinite;
    }
    .bars span:nth-child(1){height:5px;animation-delay:0s}
    .bars span:nth-child(2){height:10px;animation-delay:.1s}
    .bars span:nth-child(3){height:6px;animation-delay:.2s}
    .bars span:nth-child(4){height:12px;animation-delay:.05s}
    @keyframes barAnim { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(0.3)} }

    .footer {
      text-align: center; padding: 28px 20px; color: #cc6644; font-size: 12px;
    }
  </style>
</head>
<body>

<div class="manga-container">
  <div class="scene-title">
    <h1> 在麦当劳 — Диалог в McDonald's</h1>
    <p>Нажмите 🔊 для озвучки. Иероглифы и слова будут подсвечиваться!</p>
    <button class="play-all-btn" id="playBtn-mcdonalds" onclick="playAll('mcdonalds')">▶ Озвучить весь диалог</button>
  </div>

  <div id="panels-mcdonalds"></div>

  <div class="footer">
    🍔 McDonald's Chinese Learning · 2026<br>
    <small>Используйте Google Chrome для лучшей работы подсветки</small>
  </div>
</div>

<script>
const SCENES = {
  mcdonalds: {
    panels: [
      { img:"IMG_7558", zh:"欢迎光临！请问需要点什么？", py:"Huānyíng guānglín! Qǐngwèn xūyào diǎn shénme?", ru:"Добро пожаловать! Что будете заказывать?", who:"w", speaker:"🧑🍳 Персонал" },
      { img:"IMG_7559", zh:"你好！我要一份巨无霸套餐。", py:"Nǐ hǎo! Wǒ yào yī fèn jùwúbà tàocān.", ru:"Привет! Мне набор Биг Мак, пожалуйста.", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7560", zh:"好的，饮料要大杯还是中杯？", py:"Hǎo de, yǐnliào yào dà bēi háishì zhōng bēi?", ru:"Хорошо, напиток большой или средний?", who:"w", speaker:"🧑‍🍳 Персонал" },
      { img:"IMG_7561", zh:"大杯可乐，加冰。还要一份大份薯条。", py:"Dà bēi kělè, jiā bīng. Hái yào yí fèn dà fèn shǔtiáo.", ru:"Большую колу со льдом. И большую картошку.", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7562", zh:"我可以扫码支付吗？", py:"Wǒ kěyǐ sǎo mǎ zhīfù ma?", ru:"Можно оплатить по QR-коду?", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7563", zh:"当然可以。一共四十二元。", py:"Dāngrán kěyǐ. Yígòng sìshí'èr yuán.", ru:"Конечно. Итого 42 юаня.", who:"w", speaker:"‍🍳 Персонал" },
      { img:"IMG_7564", zh:"这是您的餐，请慢用！", py:"Zhè shì nín de cān, qǐng màn yòng!", ru:"Вот ваш заказ, приятного аппетита!", who:"w", speaker:"🧑‍🍳 Персонал" },
      { img:"IMG_7565", zh:"谢谢！嗯…真好吃！", py:"Xièxie! g… zhēn hǎo chī!", ru:"Спасибо! Ммм… очень вкусно!", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7566", zh:"再来一个冰淇淋！好香滑啊！", py:"Zài lái yí gè bīngqílín! Hǎo xiāng huá a!", ru:"Ещё одно мороженое! Такое нежное!", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7567", zh:"谢谢光临！欢迎下次再来！", py:"Xièxie guānglín! Huānyíng xià cì zài lái!", ru:"Спасибо за посещение! Приходите ещё!", who:"w", speaker:"🧑‍🍳 Персонал" }
    ]
  }
};

let zhVoice = null;
let ruVoice = null;

function loadVoices() {
  const voices = speechSynthesis.getVoices();
  zhVoice = voices.find(v => v.lang.includes('zh-CN') || v.lang.includes('cmn')) || voices[0];
  ruVoice = voices.find(v => v.lang.includes('ru-RU')) || voices[0];
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function renderScene(key) {
  const data = SCENES[key];
  const container = document.getElementById(`panels-${key}`);
  let html = "";

  data.panels.forEach((p, i) => {
    const bubbleClass = p.who === "w" ? "waiter" : "sailor";
    const speakerClass = p.who === "w" ? "w" : "s";
    const imgSrc = `img/${p.img}.png`;

    const zhChars = p.zh.split('').map((char, idx) => 
      `<span class="zh-char" data-idx="${idx}">${char}</span>`
    ).join('');

    let ruHtml = '';
    let currentCharIndex = 0;
    const ruTokens = p.ru.split(/(\s+)/); 
    ruTokens.forEach(token => {
      if (token.trim() === '') {
        ruHtml += token;
        currentCharIndex += token.length;
      } else {
        const endIdx = currentCharIndex + token.length;
        ruHtml += `<span class="ru-word" data-start="${currentCharIndex}" data-end="${endIdx}">${token}</span>`;
        currentCharIndex = endIdx;
      }
    });

    html += `
    <div class="panel" id="${key}-p${i}">
      <div class="panel-header">
        <div class="panel-num">
          <span class="panel-num-badge">${i+1}</span>
          ${p.speaker}
        </div>
        <button class="speak-btn" id="${key}-btn${i}" onclick="speakPanel('${key}',${i})" title="Озвучить">🔊</button>
      </div>
      <div class="panel-img-wrap" id="${key}-wrap${i}">
        <img class="panel-img" src="${imgSrc}" alt="Панель ${i+1}" onerror="this.parentElement.classList.add('has-error')" />
        <div class="img-error-msg">
          <div class="big">🖼️</div>
          <div><b>${p.img}.png</b> не найден<br><small>Проверьте путь: Bejdialog/img/${p.img}.png</small></div>
        </div>
      </div>
      <div class="dialogue">
        <div class="bubble ${bubbleClass}" id="${key}-bub${i}">
          <div class="speaker-tag ${speakerClass}">${p.speaker}</div>
          <div class="zh-text" id="${key}-zh${i}">${zhChars}</div>
          <div class="py-text">${p.py}</div>
          <div class="ru-text" id="${key}-ru${i}">${ruHtml}</div>
        </div>
        <div class="now-playing-bar" id="${key}-np${i}">
          <div class="bars"><span></span><span></span><span></span><span></span></div>
          <span id="${key}-np-text${i}">Идёт озвучка...</span>
        </div>
      </div>
    </div>`;
  });
  container.innerHTML = html;
}

function clearHighlights(key, idx) {
  const panel = document.getElementById(`${key}-p${idx}`);
  if(panel) {
    panel.querySelectorAll('.zh-char').forEach(el => el.classList.remove('active'));
    panel.querySelectorAll('.ru-word').forEach(el => el.classList.remove('active'));
  }
}

function speakPanel(key, idx) {
  speechSynthesis.cancel();
  clearHighlights(key, idx);

  const panelEl = document.getElementById(`${key}-p${idx}`);
  const bubEl = document.getElementById(`${key}-bub${idx}`);
  const btnEl = document.getElementById(`${key}-btn${idx}`);
  const npEl = document.getElementById(`${key}-np${idx}`);
  const npText = document.getElementById(`${key}-np-text${idx}`);

  panelEl.classList.add("active-panel");
  bubEl.classList.add("highlight");
  btnEl.classList.add("speaking");
  npEl.classList.add("visible");
  panelEl.scrollIntoView({ behavior:"smooth", block:"center" });

  const p = SCENES[key].panels[idx];

  const zhUtterance = new SpeechSynthesisUtterance(p.zh);
  zhUtterance.lang = "zh-CN";
  zhUtterance.rate = 0.75;
  zhUtterance.pitch = p.who === "s" ? 1.15 : 0.9;
  if (zhVoice) zhUtterance.voice = zhVoice;

  npText.textContent = "🇨 Китайский...";

  zhUtterance.onboundary = (event) => {
    if (event.name === 'word' || event.name === 'sentence') {
      const chars = panelEl.querySelectorAll('.zh-char');
      chars.forEach(c => c.classList.remove('active'));
      if (event.charIndex < chars.length) {
        chars[event.charIndex].classList.add('active');
      }
    }
  };

  zhUtterance.onend = () => {
    npText.textContent = "🇷🇺 Русский...";
    setTimeout(() => {
      const ruUtterance = new SpeechSynthesisUtterance(p.ru);
      ruUtterance.lang = "ru-RU";
      ruUtterance.rate = 0.85;
      if (ruVoice) ruUtterance.voice = ruVoice;

      const ruWords = panelEl.querySelectorAll('.ru-word');
      const ruText = p.ru;
      
      ruUtterance.onboundary = (event) => {
        if (event.name === 'word') {
          ruWords.forEach(w => w.classList.remove('active'));
          const wordStart = event.charIndex;
          const wordEnd = event.charIndex + event.charLength;
          ruWords.forEach(w => {
            const start = parseInt(w.dataset.start);
            const end = parseInt(w.dataset.end);
            if (start >= wordStart && end <= wordEnd + 10) {
              w.classList.add('active');
            }
          });
        }
      };

      ruUtterance.onend = () => {
        clearHighlights(key, idx);
        panelEl.classList.remove("active-panel");
        bubEl.classList.remove("highlight");
        btnEl.classList.remove("speaking");
        npEl.classList.remove("visible");
      };

      speechSynthesis.speak(ruUtterance);
    }, 300);
  };

  speechSynthesis.speak(zhUtterance);
}

const playingState = {};

function playAll(key) {
  if (playingState[key]) { 
    stopScene(key); 
    return; 
  }

  playingState[key] = true;
  const btn = document.getElementById(`playBtn-${key}`);
  btn.textContent = "⏹ Остановить";
  btn.classList.add("playing");

  const panels = SCENES[key].panels;
  let idx = 0;

  function next() {
    if (!playingState[key] || idx >= panels.length) {
      stopScene(key);
      return;
    }

    const panelEl = document.getElementById(`${key}-p${idx}`);
    const bubEl = document.getElementById(`${key}-bub${idx}`);
    const btnEl = document.getElementById(`${key}-btn${idx}`);
    const npEl = document.getElementById(`${key}-np${idx}`);
    const npText = document.getElementById(`${key}-np-text${idx}`);

    panelEl.classList.add("active-panel");
    bubEl.classList.add("highlight");
    btnEl.classList.add("speaking");
    npEl.classList.add("visible");
    panelEl.scrollIntoView({ behavior:"smooth", block:"center" });

    const p = panels[idx];

    const zhUtterance = new SpeechSynthesisUtterance(p.zh);
    zhUtterance.lang = "zh-CN";
    zhUtterance.rate = 0.75;
    zhUtterance.pitch = p.who === "s" ? 1.15 : 0.9;
    if (zhVoice) zhUtterance.voice = zhVoice;

    npText.textContent = "🇨🇳 Китайский...";

    zhUtterance.onboundary = (event) => {
      if (event.name === 'word' || event.name === 'sentence') {
        const chars = panelEl.querySelectorAll('.zh-char');
        chars.forEach(c => c.classList.remove('active'));
        if (event.charIndex < chars.length) {
          chars[event.charIndex].classList.add('active');
        }
      }
    };

    zhUtterance.onend = () => {
      npText.textContent = "🇷🇺 Русский...";
      setTimeout(() => {
        const ruUtterance = new SpeechSynthesisUtterance(p.ru);
        ruUtterance.lang = "ru-RU";
        ruUtterance.rate = 0.85;
        if (ruVoice) ruUtterance.voice = ruVoice;

        const ruWords = panelEl.querySelectorAll('.ru-word');
        
        ruUtterance.onboundary = (event) => {
          if (event.name === 'word') {
            ruWords.forEach(w => w.classList.remove('active'));
            const wordStart = event.charIndex;
            const wordEnd = event.charIndex + event.charLength;
            ruWords.forEach(w => {
              const start = parseInt(w.dataset.start);
              const end = parseInt(w.dataset.end);
              if (start >= wordStart && end <= wordEnd + 10) {
                w.classList.add('active');
              }
            });
          }
        };

        ruUtterance.onend = () => {
          clearHighlights(key, idx);
          panelEl.classList.remove("active-panel");
          bubEl.classList.remove("highlight");
          btnEl.classList.remove("speaking");
          npEl.classList.remove("visible");
          idx++;
          setTimeout(next, 600);
        };

        speechSynthesis.speak(ruUtterance);
      }, 300);
    };

    speechSynthesis.speak(zhUtterance);
  }
  next();
}

function stopScene(key) {
  speechSynthesis.cancel();
  playingState[key] = false;
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active-panel"));
  document.querySelectorAll(".bubble").forEach(b => b.classList.remove("highlight"));
  document.querySelectorAll(".speak-btn").forEach(b => b.classList.remove("speaking"));
  document.querySelectorAll(".now-playing-bar").forEach(n => n.classList.remove("visible"));
  document.querySelectorAll('.zh-char').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.ru-word').forEach(el => el.classList.remove('active'));
  
  const btn = document.getElementById(`playBtn-${key}`);
  if (btn) {
    btn.textContent = "▶ Озвучить весь диалог";
    btn.classList.remove("playing");
  }
}

window.addEventListener("load", () => {
  renderScene("mcdonalds");
  
  if (!("speechSynthesis" in window)) {
    alert("⚠️ Ваш браузер не поддерживает озвучку! Используйте Google Chrome.");
  }
});
</script>

</body>
</html>
