<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диалог в Макдональдсе - Китайский</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    background: white;
    padding: 25px;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    margin-bottom: 30px;
  }

  .header h1 {
    color: #da291c;
    font-size: 2.5em;
    margin-bottom: 10px;
    text-shadow: 2px 2px 0 #ffc72c;
  }

  .header p {
    color: #666;
    font-size: 1.1em;
  }

  .dialogue-container {
    background: white;
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    margin-bottom: 20px;
  }

  .scene-image {
    width: 100%;
    border-radius: 20px;
    margin-bottom: 30px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
  }

  .dialogue {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .message {
    display: flex;
    gap: 15px;
    align-items: flex-start;
    cursor: pointer;
    transition: all 0.3s;
    padding: 15px;
    border-radius: 15px;
  }

  .message:hover {
    background: #f8f9fa;
    transform: translateX(5px);
  }

  .message.left {
    flex-direction: row;
  }

  .message.right {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(0,0,0,0.2);
  }

  .message.left .avatar {
    background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
  }

  .message.right .avatar {
    background: linear-gradient(135deg, #48dbfb, #0abde3);
  }

  .bubble {
    background: #f1f3f5;
    padding: 15px 20px;
    border-radius: 20px;
    max-width: 70%;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  }

  .message.right .bubble {
    background: linear-gradient(135deg, #ffe66d, #feca57);
  }

  .chinese {
    font-size: 1.8em;
    font-weight: bold;
    color: #da291c;
    margin-bottom: 8px;
    line-height: 1.4;
  }

  .chinese .char {
    display: inline-block;
    transition: all 0.3s;
    padding: 2px 4px;
    border-radius: 5px;
  }

  .chinese .char.active {
    background: #ffc72c;
    color: #da291c;
    transform: scale(1.2);
  }

  .pinyin {
    font-size: 1.1em;
    color: #666;
    font-style: italic;
    margin-bottom: 8px;
  }

  .russian {
    font-size: 1em;
    color: #333;
  }

  .controls {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 30px;
  }

  .btn {
    padding: 18px 40px;
    border: none;
    border-radius: 30px;
    font-size: 1.2em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }

  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }

  .btn-play-all {
    background: linear-gradient(135deg, #da291c, #ff6b6b);
    color: white;
  }

  .btn-stop {
    background: linear-gradient(135deg, #868e96, #495057);
    color: white;
  }

  .btn-nav {
    background: linear-gradient(135deg, #ffc72c, #feca57);
    color: #da291c;
  }

  .status {
    text-align: center;
    margin-top: 20px;
    padding: 15px;
    border-radius: 15px;
    background: #e3f2fd;
    color: #1976d2;
    font-weight: bold;
    font-size: 1.1em;
  }

  .playing {
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(218, 41, 28, 0.7); }
    50% { box-shadow: 0 0 0 15px rgba(218, 41, 28, 0); }
  }

  .scene-indicator {
    text-align: center;
    margin-bottom: 20px;
    font-size: 1.3em;
    color: #da291c;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1> Диалог в Макдональдсе</h1>
    <p>Нажмите на фразу для озвучки или "Воспроизвести весь диалог"</p>
  </div>

  <div class="scene-indicator" id="sceneIndicator">Сцена 1 из 10: Приветствие</div>

  <div class="dialogue-container">
    <img id="sceneImage" src="img/IMG_7558.png" alt="Сцена" class="scene-image">
    
    <div class="dialogue" id="dialogue">
      <!-- Диалог загружается через JS -->
    </div>

    <div class="controls">
      <button class="btn btn-nav" onclick="prevScene()">⬅ Предыдущая</button>
      <button class="btn btn-play-all" onclick="playAllDialogue()">▶ Весь диалог</button>
      <button class="btn btn-stop" onclick="stopAudio()">⏹ Стоп</button>
      <button class="btn btn-nav" onclick="nextScene()">Следующая ➡</button>
    </div>

    <div class="status" id="status">Нажмите на фразу или "Весь диалог" для озвучки</div>
  </div>
</div>

<script>
const scenes = [
  {
    name: "Приветствие",
    image: "img/IMG_7558.png",
    dialogue: [
      {
        speaker: "staff",
        chinese: "欢迎光临！",
        pinyin: "Huānyíng guānglín!",
        russian: "Добро пожаловать!"
      },
      {
        speaker: "customer",
        chinese: "你好！我要一份巨无霸套餐。",
        pinyin: "Nǐ hǎo! Wǒ yào yī fèn jùwúbà tàocān.",
        russian: "Привет! Мне набор Биг Мак, пожалуйста."
      }
    ]
  },
  {
    name: "Выбор меню",
    image: "img/IMG_7559.png",
    dialogue: [
      {
        speaker: "customer",
        chinese: "嗯…选哪个好呢？",
        pinyin: "g... xuǎn nǎge hǎo ne?",
        russian: "Хм… что же выбрать?"
      }
    ]
  },
  {
    name: "Заказ",
    image: "img/IMG_7560.png",
    dialogue: [
      {
        speaker: "customer",
        chinese: "请给我一个芝士汉堡和大份薯条。",
        pinyin: "Qǐng gěi wǒ yīgè zhīshì hànbǎo hé dà fèn shǔtiáo.",
        russian: "Один чизбургер и большую картошку, пожалуйста."
      },
      {
        speaker: "staff",
        chinese: "好的，马上来。",
        pinyin: "Hǎo de, mǎshàng lái.",
        russian: "Хорошо, сейчас будет."
      }
    ]
  },
  {
    name: "Вопрос о меню",
    image: "img/IMG_7561.png",
    dialogue: [
      {
        speaker: "customer",
        chinese: "请问今天有素食选项吗？",
        pinyin: "Qǐngwèn jīntiān yǒu sùshí xuǎnxiàng ma?",
        russian: "Подскажите, есть сегодня вегетарианские блюда?"
      },
      {
        speaker: "staff",
        chinese: "有的，我们有蔬菜汉堡。",
        pinyin: "Yǒu de, wǒmen yǒu shūcài hànbǎo.",
        russian: "Да, у нас есть овощной бургер."
      }
    ]
  },
  {
    name: "Оплата",
    image: "img/IMG_7562.png",
    dialogue: [
      {
        speaker: "customer",
        chinese: "我可以扫码支付吗？",
        pinyin: "Wǒ kěyǐ sǎo mǎ zhīfù ma?",
        russian: "Можно оплатить по QR-коду?"
      },
      {
        speaker: "staff",
        chinese: "当然可以。",
        pinyin: "Dāngrán kěyǐ.",
        russian: "Конечно, можно."
      }
    ]
  },
  {
    name: "Получение заказа",
    image: "img/IMG_7563.png",
    dialogue: [
      {
        speaker: "staff",
        chinese: "这是您的餐，请慢用！",
        pinyin: "Zhè shì nín de cān, qǐng màn yòng!",
        russian: "Вот ваш заказ, приятного аппетита!"
      },
      {
        speaker: "customer",
        chinese: "谢谢！",
        pinyin: "Xièxie!",
        russian: "Спасибо!"
      }
    ]
  },
  {
    name: "Поиск места",
    image: "img/IMG_7564.png",
    dialogue: [
      {
        speaker: "customer",
        chinese: "哪里有座位？",
        pinyin: "Nǎlǐ yǒu zuòwèi?",
        russian: "Где есть свободные места?"
      }
    ]
  },
  {
    name: "Вкусная еда",
    image: "img/IMG_7565.png",
    dialogue: [
      {
        speaker: "customer",
        chinese: "真好吃！",
        pinyin: "Zhēn hǎochī!",
        russian: "Очень вкусно!"
      }
    ]
  },
  {
    name: "Десерт",
    image: "img/IMG_7566.png",
    dialogue: [
      {
        speaker: "customer",
        chinese: "好香滑啊！",
        pinyin: "Hǎo xiāng huá a!",
        russian: "Такое нежное и сливочное!"
      }
    ]
  },
  {
    name: "Прощание",
    image: "img/IMG_7567.png",
    dialogue: [
      {
        speaker: "customer",
        chinese: "再见！谢谢光临！",
        pinyin: "Zàijiàn! Xièxie guānglín!",
        russian: "До свидания! Спасибо за посещение!"
      },
      {
        speaker: "staff",
        chinese: "欢迎下次再来！",
        pinyin: "Huānyíng xiàcì zài lái!",
        russian: "Приходите ещё!"
      }
    ]
  }
];

let currentScene = 0;
let synth = window.speechSynthesis;
let isPlaying = false;
let currentUtterance = null;

function loadScene(index) {
  currentScene = index;
  const scene = scenes[index];
  
  document.getElementById('sceneImage').src = scene.image;
  document.getElementById('sceneIndicator').textContent = `Сцена ${index + 1} из ${scenes.length}: ${scene.name}`;
  
  const dialogueDiv = document.getElementById('dialogue');
  dialogueDiv.innerHTML = '';
  
  scene.dialogue.forEach((msg, i) => {
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${msg.speaker}`;
    messageDiv.onclick = () => playMessage(index, i);
    
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = msg.speaker === 'staff' ? '👩‍' : '👧';
    
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    
    const chineseDiv = document.createElement('div');
    chineseDiv.className = 'chinese';
    msg.chinese.split('').forEach(char => {
      const span = document.createElement('span');
      span.className = 'char';
      span.textContent = char;
      chineseDiv.appendChild(span);
    });
    
    const pinyinDiv = document.createElement('div');
    pinyinDiv.className = 'pinyin';
    pinyinDiv.textContent = msg.pinyin;
    
    const russianDiv = document.createElement('div');
    russianDiv.className = 'russian';
    russianDiv.textContent = msg.russian;
    
    bubble.appendChild(chineseDiv);
    bubble.appendChild(pinyinDiv);
    bubble.appendChild(russianDiv);
    
    messageDiv.appendChild(avatar);
    messageDiv.appendChild(bubble);
    dialogueDiv.appendChild(messageDiv);
  });
  
  document.getElementById('status').textContent = `Сцена ${index + 1}: ${scene.name}. Нажмите на фразу для озвучки`;
}

function playMessage(sceneIndex, messageIndex) {
  stopAudio();
  
  const scene = scenes[sceneIndex];
  const msg = scene.dialogue[messageIndex];
  
  const messages = document.querySelectorAll('.message');
  messages.forEach(m => m.classList.remove('playing'));
  messages[messageIndex].classList.add('playing');
  
  document.getElementById('status').textContent = '🔊 Воспроизведение...';
  
  // Озвучка китайского
  const chineseUtterance = new SpeechSynthesisUtterance(msg.chinese);
  chineseUtterance.lang = 'zh-CN';
  chineseUtterance.rate = 0.8;
  
  const chars = messages[messageIndex].querySelectorAll('.char');
  let charIndex = 0;
  
  chineseUtterance.onboundary = (event) => {
    if (event.name === 'word' && charIndex < chars.length) {
      chars.forEach(c => c.classList.remove('active'));
      chars[charIndex].classList.add('active');
      charIndex++;
    }
  };
  
  chineseUtterance.onend = () => {
    chars.forEach(c => c.classList.remove('active'));
    
    // Озвучка русского
    const russianUtterance = new SpeechSynthesisUtterance(msg.russian);
    russianUtterance.lang = 'ru-RU';
    russianUtterance.rate = 0.9;
    
    russianUtterance.onend = () => {
      messages[messageIndex].classList.remove('playing');
      document.getElementById('status').textContent = '✅ Готово! Нажмите на другую фразу';
    };
    
    synth.speak(russianUtterance);
  };
  
  synth.speak(chineseUtterance);
}

async function playAllDialogue() {
  stopAudio();
  
  const scene = scenes[currentScene];
  const messages = document.querySelectorAll('.message');
  
  document.getElementById('status').textContent = '🔊 Воспроизведение всего диалога...';
  
  for (let i = 0; i < scene.dialogue.length; i++) {
    if (!isPlaying) break;
    
    const msg = scene.dialogue[i];
    messages[i].classList.add('playing');
    
    // Озвучка китайского
    await speakAndWait(msg.chinese, 'zh-CN', 0.8, messages[i]);
    
    // Озвучка русского
    await speakAndWait(msg.russian, 'ru-RU', 0.9, messages[i]);
    
    messages[i].classList.remove('playing');
  }
  
  document.getElementById('status').textContent = '✅ Диалог завершён!';
}

function speakAndWait(text, lang, rate, messageElement) {
  return new Promise((resolve) => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang;
    utterance.rate = rate;
    
    const chars = messageElement.querySelectorAll('.char');
    let charIndex = 0;
    
    utterance.onboundary = (event) => {
      if (event.name === 'word' && charIndex < chars.length) {
        chars.forEach(c => c.classList.remove('active'));
        chars[charIndex].classList.add('active');
        charIndex++;
      }
    };
    
    utterance.onend = () => {
      chars.forEach(c => c.classList.remove('active'));
      setTimeout(resolve, 500);
    };
    
    currentUtterance = utterance;
    synth.speak(utterance);
  });
}

function stopAudio() {
  synth.cancel();
  isPlaying = false;
  
  document.querySelectorAll('.message').forEach(m => m.classList.remove('playing'));
  document.querySelectorAll('.char').forEach(c => c.classList.remove('active'));
  
  document.getElementById('status').textContent = ' Остановлено';
}

function nextScene() {
  if (currentScene < scenes.length - 1) {
    loadScene(currentScene + 1);
  }
}

function prevScene() {
  if (currentScene > 0) {
    loadScene(currentScene - 1);
  }
}

// Загружаем первую сцену
loadScene(0);
</script>
</body>
</html>
