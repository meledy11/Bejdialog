<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍔 McDonald's — Учим китайский</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Comfortaa:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: linear-gradient(180deg, #fff8f0 0%, #ffe8d6 50%, #ffd6b3 100%);
      font-family: 'Comfortaa', 'Noto Sans SC', sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
      overscroll-behavior: none;
    }

    .manga-container { max-width: 700px; margin: 0 auto; padding: 0 12px; }

    .scene-title {
      border-radius: 20px; padding: 22px 18px; text-align: center;
      margin: 15px 0 18px; 
      background: linear-gradient(135deg, #da291c, #ff4b2b, #ffc72c);
      box-shadow: 0 8px 32px rgba(218,41,28,0.25);
      color: white;
    }
    .scene-title h1 { font-size: 20px; margin-bottom: 5px; text-shadow: 2px 2px 8px rgba(0,0,0,0.2); }
    .scene-title p  { font-size: 13px; opacity: 0.95; margin-bottom: 14px; }

    .play-all-btn {
      background: white; color: #da291c; border: none;
      padding: 12px 28px; border-radius: 30px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      touch-action: manipulation;
    }
    .play-all-btn:active { transform: scale(0.95); }
    .play-all-btn.playing { background: #ffe8d6; color: #da291c; }

    .speed-control {
      background: white;
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(218,41,28,0.1);
      border: 2px solid #ffd6b3;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .speed-label { font-weight: 700; color: #da291c; font-size: 13px; }
    .speed-slider {
      flex: 1; min-width: 150px;
      -webkit-appearance: none; appearance: none;
      height: 8px; border-radius: 4px;
      background: linear-gradient(90deg, #da291c, #ffc72c); outline: none;
    }
    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 24px; height: 24px;
      border-radius: 50%; background: white; border: 3px solid #da291c; cursor: pointer;
    }
    .speed-value {
      font-weight: 700; color: #da291c; font-size: 14px;
      min-width: 50px; text-align: center;
      background: #fff0f0; padding: 4px 10px; border-radius: 12px;
    }

    .panel {
      background: white; border-radius: 16px; margin-bottom: 16px;
      overflow: hidden; box-shadow: 0 4px 20px rgba(218,41,28,0.1);
      border: 2px solid #ffd6b3; transition: all 0.3s;
    }
    .panel.active-panel {
      border-color: #da291c;
      box-shadow: 0 0 0 3px rgba(218,41,28,0.15), 0 8px 30px rgba(255,199,44,0.25);
    }

    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: #fffaf8;
      border-bottom: 1px dashed #ffd6b3;
    }
    .panel-num {
      font-weight: 700; color: #da291c; font-size: 13px;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-num-badge {
      background: linear-gradient(135deg, #da291c, #ffc72c); color: white;
      width: 24px; height: 24px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center; font-size: 12px;
    }

    .speak-buttons { display: flex; gap: 8px; align-items: center; }

    .action-btn {
      border: none; width: 40px; height: 40px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 18px; transition: 0.2s; flex-shrink: 0;
      color: white; position: relative; touch-action: manipulation;
    }
    .action-btn:active { transform: scale(0.9); }
    
    .speak-btn-zh { background: linear-gradient(135deg, #da291c, #ff6b6b); }
    .speak-btn-ru { background: linear-gradient(135deg, #4a90e2, #67b26f); }
    .speak-btn.speaking { animation: pulse 0.9s ease-in-out infinite; }
    
    .record-btn { background: linear-gradient(135deg, #ff9800, #f57c00); }
    .record-btn.recording { 
      background: linear-gradient(135deg, #f44336, #d32f2f);
      animation: pulse 0.9s ease-in-out infinite;
    }
    .record-btn.has-recording { background: linear-gradient(135deg, #4CAF50, #67b26f); }
    
    .delete-overlay {
      position: absolute; top: -2px; right: -2px;
      width: 18px; height: 18px; background: #f44336;
      border: 2px solid white; border-radius: 50%;
      font-size: 10px; display: none; align-items: center; justify-content: center;
      color: white; cursor: pointer; z-index: 2;
    }
    .record-btn.has-recording .delete-overlay { display: flex; }
    
    @keyframes pulse {
      0%,100%{box-shadow:0 0 0 0 rgba(218,41,28,0.45)}
      50%{box-shadow:0 0 0 12px rgba(218,41,28,0)}
    }

    .panel-img-wrap {
      position: relative; background: linear-gradient(135deg, #fff8f0, #ffe8d6);
      min-height: 150px; overflow: hidden;
      border-top: 1px dashed #ffd6b3; border-bottom: 1px dashed #ffd6b3;
    }
    .panel-img { width: 100%; display: block; }
    .img-error-msg {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center; flex-direction: column;
      gap: 8px; color: #cc6644; text-align: center; padding: 20px; font-size: 13px;
    }
    .img-error-msg .big { font-size: 40px; }
    .panel-img-wrap.has-error .panel-img     { display: none; }
    .panel-img-wrap.has-error .img-error-msg { display: flex; }

    .dialogue { padding: 18px 16px; }

    .bubble {
      padding: 16px; border-radius: 14px; margin-bottom: 14px;
      border: 2px solid transparent;
    }
    .bubble.waiter { background: linear-gradient(135deg, #f0f8ff, #fff); border-color: #99ccff; }
    .bubble.sailor { background: linear-gradient(135deg, #fff5f8, #fff); border-color: #ffb3cc; }

    .speaker-tag { font-size: 12px; font-weight: 700; margin-bottom: 8px; }
    .speaker-tag.w { color: #4488cc; }
    .speaker-tag.s { color: #cc4488; }

    .zh-text {
      font-family: 'Noto Sans SC', sans-serif; 
      font-size: 26px; font-weight: 700; color: #2a2a2a; 
      margin-bottom: 8px; line-height: 1.6; letter-spacing: 2px;
      padding: 8px 12px; border-radius: 10px;
      transition: all 0.3s ease; background: white;
    }
    .zh-text.active {
      background: #ffc72c; color: #da291c;
      box-shadow: 0 4px 15px rgba(255, 199, 44, 0.6); transform: scale(1.02);
    }

    .py-text { font-size: 15px; color: #888; font-style: italic; margin-bottom: 10px; font-weight: 600; }

    .ru-text {
      font-size: 16px; color: #555; line-height: 1.6;
      padding: 8px 12px; border-left: 4px solid #ffd6b3;
      border-radius: 10px; transition: all 0.3s ease; background: white;
    }
    .ru-text.active {
      background: #4a90e2; color: white; border-left-color: #2c5aa0;
      box-shadow: 0 4px 15px rgba(74, 144, 226, 0.5); transform: scale(1.02);
    }

    .now-playing-bar {
      display: none; align-items: center; gap: 8px;
      font-size: 12px; color: #da291c; font-weight: 700;
      padding: 6px 14px; background: #fff0f0;
      border-radius: 20px; margin-top: 12px;
    }
    .now-playing-bar.visible { display: inline-flex; }
    .bars { display: flex; gap: 3px; align-items: flex-end; height: 14px; }
    .bars span {
      width: 4px; background: #da291c; border-radius: 2px;
      animation: barAnim 0.6s ease-in-out infinite;
    }
    .bars span:nth-child(1){height:5px;animation-delay:0s}
    .bars span:nth-child(2){height:10px;animation-delay:.1s}
    .bars span:nth-child(3){height:6px;animation-delay:.2s}
    .bars span:nth-child(4){height:12px;animation-delay:.05s}
    @keyframes barAnim { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(0.3)} }

    .footer { text-align: center; padding: 28px 20px; color: #cc6644; font-size: 12px; }

    .toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(40,15,50,0.95); color: white;
      padding: 12px 24px; border-radius: 30px;
      font-size: 14px; font-family: inherit; z-index: 999;
      transition: transform 0.3s ease; pointer-events: none; white-space: nowrap;
      backdrop-filter: blur(10px);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="manga-container">
  <div class="scene-title">
    <h1> 在麦当劳 — Диалог в McDonald's</h1>
    <p>Нажмите  — услышите свой голос или браузерную озвучку</p>
    <button class="play-all-btn" id="playBtn-mcdonalds" onclick="playAll('mcdonalds')">▶ Озвучить весь диалог</button>
  </div>

  <div class="speed-control">
    <div class="speed-label">🐢 Скорость TTS:</div>
    <input type="range" id="speedSlider" class="speed-slider" min="0.3" max="1.0" step="0.05" value="0.55">
    <div class="speed-value" id="speedValue">0.55x</div>
  </div>

  <div id="panels-mcdonalds"></div>

  <div class="footer">
     McDonald's Chinese Learning · 2026
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCENES = {
  mcdonalds: {
    panels: [
      { img:"IMG_7558", zh:"你好！我要一份巨无霸套餐。", py:"Nǐ hǎo! Wǒ yào yī fèn jùwúbà tàocān.", ru:"Привет! Мне набор Биг Мак, пожалуйста.", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7559", zh:"嗯…选哪个好呢？", py:"Ńg... xuǎn nǎge hǎo ne?", ru:"Хм… что же выбрать?", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7560", zh:"请给我一个芝士汉堡和大份薯条。", py:"Qng gěi wǒ yīgè zhīshì hànbǎo hé dà fèn shǔtiáo.", ru:"Один чизбургер и большую картошку, пожалуйста.", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7561", zh:"请问今天有素食选项吗？", py:"Qǐngwèn jīntiān yǒu sùshí xuǎnxiàng ma?", ru:"Подскажите, есть сегодня вегетарианские блюда?", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7562", zh:"我可以扫码支付吗？", py:"Wǒ kěyǐ sǎo mǎ zhīfù ma?", ru:"Можно оплатить по QR-коду?", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7563", zh:"这是您的餐，请慢用！", py:"Zhè shì nín de cān, qǐng màn yòng!", ru:"Вот ваш заказ, приятного аппетита!", who:"w", speaker:"🧑‍ Персонал" },
      { img:"IMG_7564", zh:"哪里有座位？", py:"Nǎlǐ yǒu zuòwèi?", ru:"Где есть свободные места?", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7565", zh:"真好吃！", py:"Zhēn hǎochī!", ru:"Очень вкусно!", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7566", zh:"好香滑啊！", py:"Hǎo xiāng huá a!", ru:"Такое нежное и сливочное!", who:"s", speaker:"👧 Покупатель" },
      { img:"IMG_7567", zh:"再见！谢谢光临！欢迎下次再来！", py:"Zàijiàn! Xièxie guānglín! Huānyíng xiàcì zài lái!", ru:"До свидания! Спасибо, приходите ещё!", who:"s", speaker:"👧 Покупатель" }
    ]
  }
};

let zhVoice = null;
let ruVoice = null;
let currentSpeed = 0.55;
let mediaRecorder = null;
let recordedChunks = [];
let db = null;
let isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

// IndexedDB
function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('McDonaldsAudio_v3', 1);
    request.onupgradeneeded = (event) => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains('recordings')) {
        db.createObjectStore('recordings');
      }
    };
    request.onsuccess = (event) => { db = event.target.result; resolve(db); };
    request.onerror = (event) => reject(event.target.error);
  });
}

function saveToDB(key, blob) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(['recordings'], 'readwrite');
    const req = tx.objectStore('recordings').put(blob, key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function getFromDB(key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(['recordings'], 'readonly');
    const req = tx.objectStore('recordings').get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function deleteFromDB(key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(['recordings'], 'readwrite');
    const req = tx.objectStore('recordings').delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function loadVoices() {
  const voices = speechSynthesis.getVoices();
  zhVoice = voices.find(v => v.lang.includes('zh-CN') || v.lang.includes('cmn')) || voices[0];
  ruVoice = voices.find(v => v.lang.includes('ru-RU')) || voices[0];
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

document.getElementById('speedSlider').addEventListener('input', (e) => {
  currentSpeed = parseFloat(e.target.value);
  document.getElementById('speedValue').textContent = currentSpeed.toFixed(2) + 'x';
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Рендер
async function renderScene(key) {
  const data = SCENES[key];
  const container = document.getElementById(`panels-${key}`);
  let html = "";

  data.panels.forEach((p, i) => {
    const bubbleClass = p.who === "w" ? "waiter" : "sailor";
    const speakerClass = p.who === "w" ? "w" : "s";
    const imgSrc = `img/${p.img}.png`;

    html += `
    <div class="panel" id="${key}-p${i}">
      <div class="panel-header">
        <div class="panel-num">
          <span class="panel-num-badge">${i+1}</span>
          ${p.speaker}
        </div>
        <div class="speak-buttons">
          <button class="action-btn speak-btn speak-btn-zh" id="${key}-btn-zh-${i}" onclick="handleSpeak('${key}',${i},'zh')">🇨🇳</button>
          <button class="action-btn record-btn" id="${key}-rec-zh-${i}" onclick="toggleRecording('${key}',${i},'zh')">
            🎤<span class="delete-overlay" onclick="event.stopPropagation(); handleDelete('${key}',${i},'zh')">✕</span>
          </button>
          <button class="action-btn speak-btn speak-btn-ru" id="${key}-btn-ru-${i}" onclick="handleSpeak('${key}',${i},'ru')">🇷🇺</button>
          <button class="action-btn record-btn" id="${key}-rec-ru-${i}" onclick="toggleRecording('${key}',${i},'ru')">
            🎤<span class="delete-overlay" onclick="event.stopPropagation(); handleDelete('${key}',${i},'ru')">✕</span>
          </button>
        </div>
      </div>
      <div class="panel-img-wrap" id="${key}-wrap${i}">
        <img class="panel-img" src="${imgSrc}" alt="Panel ${i+1}" onerror="this.parentElement.classList.add('has-error')" />
        <div class="img-error-msg"><div class="big">🖼️</div><div><b>${p.img}.png</b> не найден</div></div>
      </div>
      <div class="dialogue">
        <div class="bubble ${bubbleClass}" id="${key}-bub${i}">
          <div class="speaker-tag ${speakerClass}">${p.speaker}</div>
          <div class="zh-text" id="${key}-zh-${i}">${p.zh}</div>
          <div class="py-text">${p.py}</div>
          <div class="ru-text" id="${key}-ru-${i}">${p.ru}</div>
        </div>
        <div class="now-playing-bar" id="${key}-np${i}">
          <div class="bars"><span></span><span></span><span></span><span></span></div>
          <span id="${key}-np-text${i}">Идёт озвучка...</span>
        </div>
      </div>
    </div>`;
  });
  container.innerHTML = html;
  await checkRecordings(key);
}

async function checkRecordings(key) {
  const data = SCENES[key];
  for (let i = 0; i < data.panels.length; i++) {
    for (const lang of ['zh', 'ru']) {
      try {
        const blob = await getFromDB(`${key}_${lang}_${i}`);
        if (blob) {
          const recBtn = document.getElementById(`${key}-rec-${lang}-${i}`);
          if (recBtn) recBtn.classList.add('has-recording');
        }
      } catch(e) {}
    }
  }
}

// ЗАПИСЬ
async function toggleRecording(key, idx, lang) {
  const recBtn = document.getElementById(`${key}-rec-${lang}-${idx}`);
  
  if (recBtn.classList.contains('recording')) {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ 
      audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 44100 } 
    });

    let mimeType = 'audio/webm';
    if (isIOS && MediaRecorder.isTypeSupported('audio/mp4')) {
      mimeType = 'audio/mp4';
    }

    mediaRecorder = new MediaRecorder(stream, { mimeType });
    recordedChunks = [];
    
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };
    
    mediaRecorder.onstop = async () => {
      const blob = new Blob(recordedChunks, { type: mimeType });
      const dbKey = `${key}_${lang}_${idx}`;
      
      try {
        await saveToDB(dbKey, blob);
        const btn = document.getElementById(`${key}-rec-${lang}-${idx}`);
        if (btn) btn.classList.add('has-recording');
        showToast('✅ Запись сохранена!');
      } catch(e) {
        showToast('❌ Ошибка сохранения!');
      }
      
      stream.getTracks().forEach(t => t.stop());
    };
    
    mediaRecorder.start(100);
    recBtn.classList.add('recording');
    showToast('🔴 Запись... Нажмите ещё раз');
    
    setTimeout(() => {
      if (recBtn.classList.contains('recording')) toggleRecording(key, idx, lang);
    }, 15000);
    
  } catch (err) {
    showToast('⚠️ Нет доступа к микрофону!');
  }
}

async function handleDelete(key, idx, lang) {
  const dbKey = `${key}_${lang}_${idx}`;
  try {
    await deleteFromDB(dbKey);
    const recBtn = document.getElementById(`${key}-rec-${lang}-${idx}`);
    if (recBtn) recBtn.classList.remove('has-recording');
    showToast('🗑️ Удалено');
  } catch(e) {}
}

// ОЗВУЧКА (ИСПРАВЛЕНО - только один источник звука)
async function handleSpeak(key, idx, lang) {
  // СТОП всё текущее
  speechSynthesis.cancel();
  
  const dbKey = `${key}_${lang}_${idx}`;
  
  try {
    const blob = await getFromDB(dbKey);
    
    if (blob) {
      // ЕСТЬ ЗАПИСЬ - играем только её
      const audio = new Audio(URL.createObjectURL(blob));
      audio.playsInline = true;
      
      highlightText(key, idx, lang);
      
      audio.onended = () => {
        clearHighlight(key, idx, lang);
      };
      
      audio.onerror = () => {
        clearHighlight(key, idx, lang);
        showToast('❌ Ошибка воспроизведения');
      };
      
      await audio.play();
    } else {
      // НЕТ ЗАПИСИ - используем TTS
      highlightText(key, idx, lang);
      
      const p = SCENES[key].panels[idx];
      const text = lang === 'zh' ? p.zh : p.ru;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang === 'zh' ? "zh-CN" : "ru-RU";
      utterance.rate = lang === 'zh' ? currentSpeed : currentSpeed * 1.1;
      utterance.pitch = (lang === 'zh' && p.who === "s") ? 1.15 : 0.9;
      
      if (lang === 'zh' && zhVoice) utterance.voice = zhVoice;
      if (lang === 'ru' && ruVoice) utterance.voice = ruVoice;
      
      utterance.onend = () => clearHighlight(key, idx, lang);
      utterance.onerror = () => clearHighlight(key, idx, lang);
      
      speechSynthesis.speak(utterance);
    }
  } catch(e) {
    // Если ошибка с DB - используем TTS
    highlightText(key, idx, lang);
    const p = SCENES[key].panels[idx];
    const text = lang === 'zh' ? p.zh : p.ru;
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang === 'zh' ? "zh-CN" : "ru-RU";
    utterance.rate = lang === 'zh' ? currentSpeed : currentSpeed * 1.1;
    utterance.onend = () => clearHighlight(key, idx, lang);
    speechSynthesis.speak(utterance);
  }
}

function highlightText(key, idx, lang) {
  const el = document.getElementById(`${key}-${lang}-${idx}`);
  const panel = document.getElementById(`${key}-p${idx}`);
  const btn = document.getElementById(`${key}-btn-${lang}-${idx}`);
  const np = document.getElementById(`${key}-np${idx}`);
  const npT = document.getElementById(`${key}-np-text${idx}`);
  
  if(el) el.classList.add('active');
  if(panel) panel.classList.add('active-panel');
  if(btn) btn.classList.add('speaking');
  if(np) np.classList.add('visible');
  if(npT) npT.textContent = lang === 'zh' ? '🇨🇳 Китайский...' : '🇷🇺 Русский...';
}

function clearHighlight(key, idx, lang) {
  const el = document.getElementById(`${key}-${lang}-${idx}`);
  const panel = document.getElementById(`${key}-p${idx}`);
  const btn = document.getElementById(`${key}-btn-${lang}-${idx}`);
  const np = document.getElementById(`${key}-np${idx}`);
  
  if(el) el.classList.remove('active');
  if(panel) panel.classList.remove('active-panel');
  if(btn) btn.classList.remove('speaking');
  if(np) np.classList.remove('visible');
}

// PLAY ALL
const playingState = {};

async function playAll(key) {
  if (playingState[key]) { stopScene(key); return; }
  
  playingState[key] = true;
  const btn = document.getElementById(`playBtn-${key}`);
  btn.textContent = '⏹ Стоп';
  btn.classList.add('playing');

  const panels = SCENES[key].panels;
  let idx = 0;

  async function processNext() {
    if (!playingState[key] || idx >= panels.length) { stopScene(key); return; }

    const panel = document.getElementById(`${key}-p${idx}`);
    const np = document.getElementById(`${key}-np${idx}`);
    const npT = document.getElementById(`${key}-np-text${idx}`);
    
    if(panel) {
      panel.classList.add('active-panel');
      np.classList.add('visible');
      panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    const p = panels[idx];

    // КИТАЙСКИЙ
    npT.textContent = '🇨🇳 Китайский...';
    await playLanguage(key, idx, 'zh');
    
    if (!playingState[key]) return;
    
    // ПАУЗА
    await sleep(400);
    
    if (!playingState[key]) return;
    
    // РУССКИЙ
    npT.textContent = '🇷🇺 Русский...';
    await playLanguage(key, idx, 'ru');
    
    if (!playingState[key]) return;
    
    idx++;
    await sleep(500);
    processNext();
  }

  processNext();
}

async function playLanguage(key, idx, lang) {
  const dbKey = `${key}_${lang}_${idx}`;
  
  try {
    const blob = await getFromDB(dbKey);
    
    if (blob) {
      // Запись - играем её
      const audio = new Audio(URL.createObjectURL(blob));
      audio.playsInline = true;
      highlightText(key, idx, lang);
      
      return new Promise((resolve) => {
        audio.onended = () => {
          clearHighlight(key, idx, lang);
          resolve();
        };
        audio.onerror = () => {
          clearHighlight(key, idx, lang);
          resolve();
        };
        audio.play().catch(() => resolve());
      });
    } else {
      // TTS
      highlightText(key, idx, lang);
      const p = SCENES[key].panels[idx];
      const text = lang === 'zh' ? p.zh : p.ru;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang === 'zh' ? "zh-CN" : "ru-RU";
      utterance.rate = lang === 'zh' ? currentSpeed : currentSpeed * 1.1;
      utterance.pitch = (lang === 'zh' && p.who === "s") ? 1.15 : 0.9;
      
      if (lang === 'zh' && zhVoice) utterance.voice = zhVoice;
      if (lang === 'ru' && ruVoice) utterance.voice = ruVoice;
      
      return new Promise((resolve) => {
        utterance.onend = () => {
          clearHighlight(key, idx, lang);
          resolve();
        };
        utterance.onerror = () => {
          clearHighlight(key, idx, lang);
          resolve();
        };
        speechSynthesis.speak(utterance);
      });
    }
  } catch(e) {
    // Fallback на TTS
    highlightText(key, idx, lang);
    const p = SCENES[key].panels[idx];
    const text = lang === 'zh' ? p.zh : p.ru;
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang === 'zh' ? "zh-CN" : "ru-RU";
    utterance.rate = lang === 'zh' ? currentSpeed : currentSpeed * 1.1;
    
    return new Promise((resolve) => {
      utterance.onend = () => {
        clearHighlight(key, idx, lang);
        resolve();
      };
      speechSynthesis.speak(utterance);
    });
  }
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function stopScene(key) {
  speechSynthesis.cancel();
  playingState[key] = false;
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active-panel'));
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  document.querySelectorAll('.now-playing-bar').forEach(n => n.classList.remove('visible'));
  document.querySelectorAll('.zh-text, .ru-text').forEach(el => el.classList.remove('active'));
  
  const btn = document.getElementById(`playBtn-${key}`);
  if (btn) { btn.textContent = '▶ Озвучить весь диалог'; btn.classList.remove('playing'); }
}

window.addEventListener('load', async () => {
  await initDB();
  renderScene('mcdonalds');
  if (!('speechSynthesis' in window)) showToast('⚠️ Используйте Chrome/Safari');
});
</script>
</body>
</html>
